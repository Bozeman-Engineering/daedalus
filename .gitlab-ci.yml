include:
  ################
  # DrupalCI includes:
  # As long as you include this, any future includes added by the Drupal Association will be accessible to your pipelines automatically.
  # View these include files at https://git.drupalcode.org/project/gitlab_templates/
  ################
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

variables:
  # The module is tested on the two core minors composer.json allows
  # (>=11.3 <11.5). The current-core variant autoruns by default; the
  # previous-minor variant must be opted in and, since gitlab_templates 1.15,
  # is a manual job unless _AUTORUN_PREVIOUS_MINOR says otherwise (valid values:
  # none, push, push-and-mr, push-and-schedule, all). 'push' runs it on every
  # push to the canonical project, which is where a release is cut from, so
  # 11.3 stays tested without doubling every merge-request pipeline.
  OPT_IN_TEST_PREVIOUS_MINOR: '1'
  _AUTORUN_PREVIOUS_MINOR: 'push'

# CI tests against the sibling tips; composer.json ships stable carets.
# before_script is the documented contrib hook (gitlab_templates
# docs/info/customizations.md) and .composer-base covers all variants.
# Stability flags are root-only in Composer, so the test fixture
# (daedalus_recipe, which installs the site every Kernel and browser test
# builds on) and the theme it requires are pinned to their dev branches here,
# or their carets cannot resolve a dev branch or an alpha tag at the
# template's default (stable) minimum-stability.
.composer-base:
  before_script:
    - composer require --no-update --no-interaction
      drupal/daedalus_recipe:1.0.x-dev
      drupal/daedalus_theme:1.0.x-dev
      drupal/field_sample_value:1.1.x-dev
      drupal/twig_events:1.1.x-dev

# The Unit tier drives the node:test suites (modules/*/tests/js/*.test.mjs)
# through tests/src/Traits/NodeSuitesTrait.php, which takes `node` from PATH
# and fails (never skips) on a missing dependency or a non-zero exit. The
# phpunit job gives it neither: gitlab_templates' .phpunit-base runs no nvm
# step (the *check-nvm anchor serves only the composer job's yarn path and the
# lint jobs, so _NODE_VERSION does not reach here), its image ships Node 20,
# and nothing installs the package.json dependencies (node_modules is
# gitignored). The suites need Node >= 22.15 (registerHooks from node:module).
# The tests run as `sudo -u www-data -H -E`, so an nvm install under root's
# $HOME would be invisible to them; the official Node 22 LTS tarball unpacked
# over /usr/local puts `node` and `npm` on the PATH every user inherits.
# `npm ci` runs as root in $DRUPAL_PROJECT_FOLDER (the module's path inside
# the site, exported by the composer job's build.env; package-lock.json is
# committed) and *setup-webserver later chowns the whole checkout to www-data,
# so the tests read node_modules like any other project file.
.phpunit-base:
  before_script:
    - |
      case "$(uname -m)" in
        x86_64) NODE_ARCH=linux-x64 ;;
        aarch64) NODE_ARCH=linux-arm64 ;;
        *) echo "Unsupported architecture $(uname -m)" && exit 1 ;;
      esac
      NODE_DIST=https://nodejs.org/dist/latest-v22.x
      NODE_TMP=$(mktemp -d)
      cd "$NODE_TMP"
      curl -fsSLO "$NODE_DIST/SHASUMS256.txt"
      NODE_TARBALL=$(grep -o "node-v22\.[0-9]*\.[0-9]*-$NODE_ARCH\.tar\.gz" SHASUMS256.txt | head -n 1)
      curl -fsSLO "$NODE_DIST/$NODE_TARBALL"
      grep " $NODE_TARBALL\$" SHASUMS256.txt | sha256sum -c -
      tar -xzf "$NODE_TARBALL" -C /usr/local --strip-components=1 --no-same-owner
      cd "$CI_PROJECT_DIR"
      rm -rf "$NODE_TMP"
      echo "node $(node --version), npm $(npm --version)"
    - cd $DRUPAL_PROJECT_FOLDER && npm ci --no-audit --no-fund && cd $CI_PROJECT_DIR
