# A skin inspired by OLIVERO.

# A skin is the site's look as data. It has a set of design token values
# and default styles that bare elements wear. The styling panel and AI all
# read the same tokens, so changing the skin restyles the whole site. Skins
# are treated as content, so editing the skin here requires a re-import
# `drush daedalus_stylish:sync` to get the changes onto the site. You can have
# multiple skins, and you can switch between them on the Appearance > skins
# page.
#
# This package ships no guide fragment: the suite's bindings (font-size,
# padding, gap and the rest to the scales every shipped skin mints) are
# its law, read under the olivero system's `enforcement: open`, so a
# typed literal still commits and the bindings only shape the offer.
# Which tokens the basic rows lead with is a fact about the tokens,
# spelled here per token as `offered`: the four space steps are the
# everyday padding and gap stops, and the gutter (the section's inline
# inset, not a padding step) is `offered: false`, legal and referenced
# by the container defaults below but off the rows. A token is stored
# as a record {value, description, offered}; a bare value here is the
# record with the defaults (offered: true, no description).

olivero:
  label: 'Olivero'
  tokens:
    color:
      bg:
        default: '#ffffff'
        dark: '#0b0d0f'
      surface:
        default: '#f6f8f8'
        dark: '#181d20'
      text:
        default: '#2b353b'
        dark: '#eaeef0'
      border:
        default: '#dce2e5'
        dark: '#2b353b'
      accent:
        default: '#1475ad'
        dark: '#52b3eb'
      accent-hover:
        default: '#116392'
        dark: '#1b9ae4'
    font:
      sans-serif: '"Metropolis", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
      serif: 'Georgia, "Times New Roman", Times, serif'
      mono: '"Courier New", Courier, monospace'
    text:
      caption: '0.85rem'
      body: '1rem'
      lead: '1.25rem'
      title:
        default: '1.5rem'
        narrow: '1.25rem'
      headline:
        default: '2.25rem'
        narrow: '1.5rem'
      display:
        default: '3.75rem'
        narrow: '1.75rem'
    weight:
      thin: '200'
      regular: '400'
      bold: '700'
    leading:
      tight: '1'
      normal: '1.5'
      relaxed: '2'
    space:
      sm: '0.5rem'
      md: '1rem'
      lg: '2rem'
      xl: '4rem'
      gutter:
        value:
          default: '2rem'
          narrow: '1rem'
        description: 'The section''s inline inset and the container gap; not a padding step.'
        offered: false
    radius:
      sm: '0.5rem'
      md: '1rem'
      lg: '2rem'
      full: '9999px'
    transition:
      fast: '150ms ease'
      normal: '250ms ease'
    layout:
      max-width: '84rem'

  # DEFAULT STYLES that get applied to bare elements.
  # Every font-size is a bare token reference, never a clamp().
  # The skin's motion: keyframes as data, delivered as @keyframes
  # motion-{name} in the compiled skin file and worn from a style as
  # animation-name: motion-{name}. An animation is a record {steps,
  # description, offered}; steps map an offset (from | to | N%) to
  # declarations in the same universal vocabulary a style map speaks
  # (media and re-timing animation-* properties refused;
  # animation-timing-function is allowed per step). Every value here is
  # a literal, so the motion plays the same on every site that wears the
  # skin. Two families. Entrances (fade_in, rise, scale_in) run once and
  # settle; this package's animation-axis variants
  # ({package}.daedalus_stylish.variants.yml) wear them with literal timings
  # and their own reduced-motion unset. Attention (pulse) and continuous
  # (spin) animations ship as materials only: they want an iteration count
  # and a purpose the advanced Motion section or the AI supplies per
  # element.
  animations:
    fade_in:
      description: 'Opacity from 0 to 1: the quietest entrance. Reach for it on sections and content that should simply appear.'
      steps:
        from:
          opacity: '0'
        to:
          opacity: '1'
    rise:
      description: 'Fade in while drifting up 1rem into place, easing out. Reach for it on cards, teasers and sections that should arrive with a little lift.'
      steps:
        from:
          opacity: '0'
          transform: 'translateY(1rem)'
          animation-timing-function: 'ease-out'
        to:
          opacity: '1'
          transform: 'none'
    scale_in:
      description: 'Fade in while growing from 96% to full size, easing out. Reach for it on media, callouts and buttons that should pop into place.'
      steps:
        from:
          opacity: '0'
          transform: 'scale(0.96)'
          animation-timing-function: 'ease-out'
        to:
          opacity: '1'
          transform: 'none'
    pulse:
      description: 'Grow to 105% and back, a heartbeat. Reach for it with an infinite iteration count on a call to action that should draw the eye; use sparingly.'
      steps:
        '0%':
          transform: 'scale(1)'
        '50%':
          transform: 'scale(1.05)'
        '100%':
          transform: 'scale(1)'
    spin:
      description: 'One full clockwise rotation. Reach for it with a linear easing and an infinite iteration count on loaders and decorative icons.'
      steps:
        from:
          transform: 'rotate(0deg)'
        to:
          transform: 'rotate(360deg)'
  defaults:
    'base:h1':
      '':
        default:
          margin-top: '0'
          margin-bottom: 'var(--space-sm)'
          font-family: 'var(--font-sans-serif)'
          font-weight: 'var(--weight-bold)'
          line-height: 'var(--leading-tight)'
          font-size: 'var(--text-display)'
    'base:h2':
      '':
        default:
          margin-top: '0'
          margin-bottom: 'var(--space-sm)'
          font-family: 'var(--font-sans-serif)'
          font-weight: 'var(--weight-bold)'
          line-height: 'var(--leading-tight)'
          font-size: 'var(--text-headline)'
    'base:h3':
      '':
        default:
          margin-top: '0'
          margin-bottom: 'var(--space-sm)'
          font-family: 'var(--font-sans-serif)'
          font-weight: 'var(--weight-bold)'
          line-height: 'var(--leading-normal)'
          font-size: 'var(--text-title)'
    'base:h4':
      '':
        default:
          margin-top: '0'
          margin-bottom: 'var(--space-sm)'
          font-family: 'var(--font-sans-serif)'
          font-weight: 'var(--weight-bold)'
          line-height: 'var(--leading-normal)'
          font-size: 'var(--text-lead)'
    'base:h5':
      '':
        default:
          margin-top: '0'
          margin-bottom: 'var(--space-sm)'
          font-family: 'var(--font-sans-serif)'
          font-weight: 'var(--weight-bold)'
          line-height: 'var(--leading-normal)'
          font-size: 'var(--text-body)'
    'base:h6':
      '':
        default:
          margin-top: '0'
          margin-bottom: 'var(--space-sm)'
          font-family: 'var(--font-sans-serif)'
          font-weight: 'var(--weight-bold)'
          line-height: 'var(--leading-normal)'
          font-size: 'var(--text-caption)'
    'base:p':
      '':
        default:
          margin-top: '0'
          margin-bottom: 'var(--space-sm)'
          font-size: 'var(--text-body)'
          line-height: 'var(--leading-relaxed)'
    'base:li':
      '':
        default:
          font-size: 'var(--text-body)'
          line-height: 'var(--leading-relaxed)'
    'base:a':
      '':
        default:
          color: 'var(--color-accent)'
          text-decoration-line: 'underline'
        hover:
          color: 'var(--color-accent-hover)'
    'base:blockquote':
      '':
        default:
          margin-top: 'var(--space-lg)'
          margin-bottom: 'var(--space-lg)'
          margin-left: '0'
          margin-right: '0'
          padding-left: 'var(--space-md)'
          border-left-width: '0.1875rem'
          border-left-style: 'solid'
          border-left-color: 'var(--color-accent)'
          font-size: 'var(--text-title)'
          line-height: 'var(--leading-normal)'
    'base:code':
      '':
        default:
          font-family: 'var(--font-mono)'
          font-size: 'var(--text-caption)'
          background-color: 'var(--color-surface)'
    'base:img':
      '':
        default:
          max-width: '100%'
          height: 'auto'
    'kind:container':
      '':
        default:
          gap: 'var(--space-gutter)'
