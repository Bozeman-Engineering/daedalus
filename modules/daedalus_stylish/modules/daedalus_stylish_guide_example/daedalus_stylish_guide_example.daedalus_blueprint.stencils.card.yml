# The "card" stencil of the Guide Example design system: a composition
# shipped as a page-language fragment (daedalus_blueprint_stencil's
# per-file lane, MODULE.daedalus_blueprint.stencils.ID.yml), placed as is
# from the palette or written with the AI's own content. No
# design_system key: the module packages guide_example, so the stencil
# is a member of it and offered only while the system is active. Its
# blocks are the Daedalus text and image blocks; the file is inert
# until daedalus_blueprint_stencil is installed and those bundles exist.
# The reference fields (media) are omitted on purpose: absent fields
# sample-populate at placement.
label: Card
description: 'A band of three cards: a Tint band at Standard rhythm holding a Columns row, each column a Card with a rounded image, an h3 title, one line of copy and a Link button. Reach for it for a row of features, services or team members; keep one card per column and never a Card in a Card.'
icon: assets/stencils/card.svg
element:
  kind: container
  layout_id: daedalus_stylish_container
  label: Cards
  styles:
    '':
      variants:
        - container_site
        - guide_band_tint
        - guide_rhythm_standard
  children:
    -
      kind: container
      layout_id: daedalus_stylish_container
      label: 'Card row'
      styles:
        '':
          variants:
            - row
      children:
        -
          kind: container
          layout_id: daedalus_stylish_container
          label: Card
          styles:
            '':
              variants:
                - guide_card
          children:
            -
              kind: block
              block_type: image
              block_fields:
                info: Image
              styles:
                '':
                  variants:
                    - guide_image_rounded
            -
              kind: block
              block_type: text
              block_fields:
                info: Text
                field_text_tag: h3
                field_text_text: 'Card title'
            -
              kind: block
              block_type: text
              block_fields:
                info: Text
                field_text_text: 'One line that says what this card is about.'
            -
              kind: block
              block_type: text
              block_fields:
                info: Text
                field_text_text: 'Read more'
                field_text_url:
