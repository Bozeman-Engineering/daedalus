# Shipped styling variants for the page builder's containers, on
# orthogonal axes (declared on the universal container kind in
# daedalus_stylish_layouts.page_builder.yml):
#
# - container_layout (label "Layout"): the mode half of mode + share (see
#   the columns variant's comment below). TWO count-independent variants,
#   columns (equal shares) and row (natural widths); the ratio fact lives
#   on the children as flex-grow overrides, never on the parent.
# - width: the constrained content width. A container is ONE box, so the
#   constraint is a padding-inline stop on the root itself:
#   `max(gutter, calc((100% - W) / 2))` keeps the background full-bleed,
#   centers the content column, and grants a gutter for free below the max.
# - animation and hover: declared on the kind, but this file ships NO
#   variant on either. The suite ships no motion of its own; a skin
#   package mints the container entrances and hover feel beside its
#   block family (starter_*_section and olivero_*_section in
#   daedalus_stylish_starter_skin.daedalus_stylish.variants.yml and
#   daedalus_stylish_olivero_skin.daedalus_stylish.variants.yml), and a
#   package that mints none shows an empty row.
#
# Both families here style the container ROOT (''), scoped to the
# container KIND: with one layout, container layout and width are
# container-wide facts, not per-layout ones. The stacking condition is
# "narrow" (the width-band condition, measured at the ONE page-level query
# root), so a row stacks when the PAGE is narrow, exactly like a
# hand-written media query, except the band follows the posed edit canvas
# rather than the browser viewport.
#
# The container layout's default_variants (in its page_builder layout
# YAML, daedalus_stylish_layouts.page_builder.layout.daedalus_stylish_container.yml)
# name ONE birth default, the width stop (width: container_site); the
# width axis is root-only, so a nested container is never defaulted a
# width. The container_layout axis has no birth default: a container at
# any depth is born stacked (the declared flex column below), and Row or
# Columns is the deliberate gesture, via the layout widget or
# apply_variant. The
# default is stamped at the op door only (document-authored sections, the
# dialect's and a blueprint's, wear exactly what the document states; see
# the layout YAML's comment), so op-added sections place constrained
# and keep following shipped updates while unmodified. The retired
# layout-exact families (onecol_* .. fourcol_*) mapped onto these generics
# in ContainerMigration::VARIANT_MAP, and the retired count-keyed
# proportions family (split_50_50 .. split_25_25_25_25) converted onto the
# columns variant (frozen ratios in ContainerMigration::SPLIT_GROWS).

# The columns variant (machine name `columns`, the id the code and the AI
# recipes speak; it was `row` until the rename post-update repointed every
# stored wearing, freeing `row` for a real Row arrangement): mode +
# share. ONE count-independent variant carries
# everything shared about columns: the row direction on the root, the
# gutter gap (the skin's space.gutter token, the same inset the width
# family rides: a token reference is the one spelling every strict law
# accepts verbatim, so the gap tracks the skin and a skinless site gets
# none, exactly as container_site already gave up the skinless posture),
# narrow stacking, and equal fill on the container's direct children (the
# '> *' children selector). The variant never states a display: the
# declared tier ships every container as `display: flex; flex-direction:
# column` (daedalus_stylish_layouts.page_builder.yml), so the variant only
# flips the direction its axis owns, and its narrow block, which flips it
# back, IS the stack (the same flex column a container is born as, not a
# second mechanic). Equal columns at every count are one worn reference
# with zero per-instance CSS, and a child added later joins at grow 1
# purely by CSS (no seeding seam exists).
# Unequal ratios are per-child flex-grow overrides written by the layout
# widget (default condition only); a child's own entry always beats these
# children rules (the printer caps the children rule at :scope weight, so
# equal specificity resolves on scope proximity to the child's own rule).
# The curated Layout group ships no `flex` shorthand, so the longhands
# spell `flex: 1 1 0` (equal fill) and `flex: none` (stacked children must
# not flex: grows never act on stacked heights).
columns:
  label: 'Columns'
  scope: 'kind:container'
  axis: 'container_layout'
  description: 'Lay the container''s children out as equal side-by-side columns that stack automatically on narrow pages. Reach for it whenever content should sit in columns; unequal ratios are per-child flex-grow overrides on top. Four children is the comfortable most: past that the columns get too narrow, so give each line of items its own columns container.'
  styles:
    '':
      default:
        flex-direction: 'row'
        gap: 'var(--space-gutter)'
      narrow:
        flex-direction: 'column'
    '::> *':
      default:
        flex-grow: '1'
        flex-shrink: '1'
        flex-basis: '0'
        min-width: '0'
      narrow:
        flex-grow: '0'
        flex-shrink: '0'
        flex-basis: 'auto'

# The row variant (machine name `row`, minted for this arrangement once
# the rename post-update freed the name): the container_layout axis's
# second shipped mode, a plain flex row of NATURAL-WIDTH children. Where
# Columns hands every child an equal share of the line (the '> *' equal
# fill above), Row lets each child keep its own size and wraps the line
# when it runs out of room (flex-wrap: wrap), so a line of buttons, a
# logo strip or a tag list never squeezes or overflows; it never flips
# to a column on narrow pages, wrapping IS its narrow behavior, so it
# ships no narrow block and no children rule. The same gutter gap as
# Columns (the skin's space.gutter token) keeps the two modes' rhythm
# one. Both screen axes mean something on a Row (the children fill
# nothing): the layout widget offers justify-content along the line
# (Left, Center, Right, Spread = space-between) and align-items across
# it, and none of that is stated here, so a wearer's alignment is its
# own layer above the wear.
row:
  label: 'Row'
  scope: 'kind:container'
  axis: 'container_layout'
  description: 'Lay the container''s children out side by side at their natural width, wrapping onto new lines when they run out of room. Reach for it over Columns when the items should keep their own size (a line of buttons, a logo strip, a tag list, a label beside a control); Columns is for content that shares the width equally. A Row never stacks on narrow pages; it wraps.'
  styles:
    '':
      default:
        flex-direction: 'row'
        flex-wrap: 'wrap'
        gap: 'var(--space-gutter)'

# Widths: the constrained content width of any section. Site width is
# the default: it references the skin's tokens (--layout-max-width for the
# stop, --space-gutter for the inset floor), so every section, the header and
# the footer share ONE number by construction and a restyled skin moves
# them together. The px family stays as explicit per-section overrides. The
# family's weights order the roster widest-first (rosters sort
# weight-then-label, lighter first): Full width down to Small, the size
# scale rather than the alphabetical accident of the labels.
container_site:
  label: 'Site width'
  scope: 'kind:container'
  axis: 'width'
  weight: 15
  description: 'Constrain the container to the site''s shared content width (the skin''s layout max-width token), centered, with the site gutter below it. The default: sections, header and footer share one number.'
  styles:
    '':
      default:
        padding-inline: 'max(var(--space-gutter), calc((100% - var(--layout-max-width)) / 2))'
container_sm:
  label: 'Small (640px)'
  scope: 'kind:container'
  axis: 'width'
  weight: 60
  description: 'Constrain the container to a narrow 640px reading column, centered. Reach for it for focused single-column content such as forms or prose.'
  styles:
    '':
      default:
        padding-inline: 'max(var(--space-gutter), calc((100% - 640px) / 2))'
container_md:
  label: 'Medium (768px)'
  scope: 'kind:container'
  axis: 'width'
  weight: 50
  description: 'Constrain the container to a 768px column, centered. A comfortable width for article-style content.'
  styles:
    '':
      default:
        padding-inline: 'max(var(--space-gutter), calc((100% - 768px) / 2))'
container_lg:
  label: 'Large (1024px)'
  scope: 'kind:container'
  axis: 'width'
  weight: 40
  description: 'Constrain the container to a 1024px column, centered. The everyday constrained-content width.'
  styles:
    '':
      default:
        padding-inline: 'max(var(--space-gutter), calc((100% - 1024px) / 2))'
container_xl:
  label: 'Extra large (1280px)'
  scope: 'kind:container'
  axis: 'width'
  weight: 30
  description: 'Constrain the container to a 1280px column, centered. A wide layout that still keeps margins on large screens.'
  styles:
    '':
      default:
        padding-inline: 'max(var(--space-gutter), calc((100% - 1280px) / 2))'
container_2xl:
  label: '2X large (1536px)'
  scope: 'kind:container'
  axis: 'width'
  weight: 20
  description: 'Constrain the container to a 1536px column, centered. The widest constrained option before full width.'
  styles:
    '':
      default:
        padding-inline: 'max(var(--space-gutter), calc((100% - 1536px) / 2))'
container_full:
  label: 'Full width'
  scope: 'kind:container'
  axis: 'width'
  weight: 10
  description: 'Let the content run to the edges of the page, inset by the site gutter alone. A section''s background already spans the screen at every width, so this is never the way to get a full-bleed color or image behind a section; reach for it when the content itself should reach the edges, such as edge-to-edge photography or a gallery grid.'
  styles:
    '':
      default:
        padding-inline: 'var(--space-gutter)'
