# Shipped styling variants for the page builder's containers, on
# orthogonal axes (declared on the universal container kind in
# daedalus_stylish_layouts.page_builder.yml):
#
# - container_layout (label "Layout"): the mode half of mode + share (see
#   the row variant's comment below). ONE count-independent variant; the
#   ratio fact lives on the children as flex-grow overrides, never on the
#   parent.
# - width: the constrained content width. A container is ONE box, so the
#   constraint is a padding-inline stop on the root itself:
#   `max(gutter, calc((100% - W) / 2))` keeps the background full-bleed,
#   centers the content column, and grants a gutter for free below the max.
# - animation: the entrance a container wears when it scrolls into view;
#   the block family's twin (daedalus_stylish.daedalus_stylish.variants.yml), same three
#   looks, same literal timings and the same in-view trigger pair, each
#   carrying its own reduced-motion unset (see the family's comment
#   below).
# - hover: the hover feel a container wears (container_lift, the block
#   family's twin): the variant's own styles carry the WHEN, a `hover`
#   block beside the rest state's `default` transition.
#
# All four axes style the container ROOT (''), scoped to the container
# KIND: with one layout, container layout, width and entrance are
# container-wide facts, not per-layout ones. The stacking condition is
# "narrow" (the width-band condition, measured at the ONE page-level query
# root), so a row stacks when the PAGE is narrow, exactly like a
# hand-written media query, except the band follows the posed edit canvas
# rather than the browser viewport.
#
# The container layout's default_variants (in its page_builder YAML) name
# a root-only width default (container_site) and a depth-qualified row
# default, stamped at the op door only (document-authored sections, the
# dialect's and a blueprint's, wear exactly what the document states; see
# the layout YAML's comment), so op-added page bands place constrained
# (and as columns) and
# keep following shipped updates while unmodified. The retired
# layout-exact families (onecol_* .. fourcol_*) mapped onto these generics
# in ContainerMigration::VARIANT_MAP, and the retired count-keyed
# proportions family (split_50_50 .. split_25_25_25_25) converted onto the
# row variant (frozen ratios in ContainerMigration::SPLIT_GROWS).

# The row variant (labeled "Columns": the wear bar echoes the widget's
# Stack | Columns words; `row` stays the machine name the code and AI
# recipes speak): mode + share. ONE count-independent variant carries
# everything shared about columns: flex on the root, the gutter gap (the
# skin's space.gutter token, the same inset the width family rides: a
# token reference is the one spelling every strict law accepts verbatim,
# so the gap tracks the skin and a skinless site gets none, exactly as
# container_site already gave up the skinless posture), narrow stacking,
# and equal fill on the container's direct children (the '::>' children
# pseudo-part). Equal columns at every count are one worn reference with
# zero per-instance CSS, and a child added later joins at grow 1 purely
# by CSS (no seeding seam exists).
# Unequal ratios are per-child flex-grow overrides written by the layout
# widget (default condition only); a child's own entry always beats these
# children rules (the printer caps the children rule at :scope weight, so
# equal specificity resolves on scope proximity to the child's own rule).
# The curated Layout group ships no `flex` shorthand, so the longhands
# spell `flex: 1 1 0` (equal fill) and `flex: none` (stacked children must
# not flex: grows never act on stacked heights).
row:
  label: 'Columns'
  scope: 'kind:container'
  axis: 'container_layout'
  description: 'Lay the container''s children out as equal side-by-side columns that stack automatically on narrow pages. Reach for it whenever content should sit in columns; unequal ratios are per-child flex-grow overrides on top. Four children is the comfortable most: past that the columns get too narrow, so give each line of items its own columns container.'
  styles:
    '':
      default:
        display: 'flex'
        gap: 'var(--space-gutter)'
      narrow:
        flex-direction: 'column'
    '::>':
      default:
        flex-grow: '1'
        flex-shrink: '1'
        flex-basis: '0'
        min-width: '0'
      narrow:
        flex-grow: '0'
        flex-shrink: '0'
        flex-basis: 'auto'

# Widths: the constrained content width of any page band. Site width is
# the default: it references the skin's tokens (--layout-max-width for the
# stop, --space-gutter for the inset floor), so every band, the header and
# the footer share ONE number by construction and a restyled skin moves
# them together. The px family stays as explicit per-band overrides. The
# family's weights order the roster widest-first (rosters sort
# weight-then-label, lighter first): Full width down to Small, the size
# scale rather than the alphabetical accident of the labels.
container_site:
  label: 'Site width'
  scope: 'kind:container'
  axis: 'width'
  weight: 15
  description: 'Constrain the container to the site''s shared content width (the skin''s layout max-width token), centered, with the site gutter below it. The default: page bands, header and footer share one number.'
  styles:
    '':
      default:
        padding-inline: 'max(var(--space-gutter), calc((100% - var(--layout-max-width)) / 2))'
container_sm:
  label: 'Small (640px)'
  scope: 'kind:container'
  axis: 'width'
  weight: 60
  description: 'Constrain the container to a narrow 640px reading column, centered. Reach for it for focused single-column content such as forms or prose.'
  styles:
    '':
      default:
        padding-inline: 'max(var(--space-gutter), calc((100% - 640px) / 2))'
container_md:
  label: 'Medium (768px)'
  scope: 'kind:container'
  axis: 'width'
  weight: 50
  description: 'Constrain the container to a 768px column, centered. A comfortable width for article-style content.'
  styles:
    '':
      default:
        padding-inline: 'max(var(--space-gutter), calc((100% - 768px) / 2))'
container_lg:
  label: 'Large (1024px)'
  scope: 'kind:container'
  axis: 'width'
  weight: 40
  description: 'Constrain the container to a 1024px column, centered. The everyday constrained-content width.'
  styles:
    '':
      default:
        padding-inline: 'max(var(--space-gutter), calc((100% - 1024px) / 2))'
container_xl:
  label: 'Extra large (1280px)'
  scope: 'kind:container'
  axis: 'width'
  weight: 30
  description: 'Constrain the container to a 1280px column, centered. A wide layout that still keeps margins on large screens.'
  styles:
    '':
      default:
        padding-inline: 'max(var(--space-gutter), calc((100% - 1280px) / 2))'
container_2xl:
  label: '2X large (1536px)'
  scope: 'kind:container'
  axis: 'width'
  weight: 20
  description: 'Constrain the container to a 1536px column, centered. The widest constrained option before full width.'
  styles:
    '':
      default:
        padding-inline: 'max(var(--space-gutter), calc((100% - 1536px) / 2))'
container_full:
  label: 'Full width'
  scope: 'kind:container'
  axis: 'width'
  weight: 10
  description: 'Let the content run to the edges of the page, inset by the site gutter alone. A band''s background already spans the screen at every width, so this is never the way to get a full-bleed color or image behind a band; reach for it when the content itself should reach the edges, such as edge-to-edge photography or a gallery grid.'
  styles:
    '':
      default:
        padding-inline: 'var(--space-gutter)'

# Entrances: the animation axis's shipped family, the block family's twin
# (daedalus_stylish.daedalus_stylish.variants.yml) so a page band and the blocks inside it
# speak one motion vocabulary. Every variant references a shipped
# animation (daedalus_stylish.daedalus_stylish.animations.yml) with LITERAL timings, never a
# token, so it resolves on any skin, and carries its own reduced-motion
# unset: skin defaults are the bottom layer and the topmost setter wins
# per property, so a skin's `animation: none` under the media query could
# never beat a variant's animation-name. The setter unsets itself; every
# wearer is honest on any skin, and the pattern is what minters copy. The
# longhands (not the shorthand) carry the default so the advanced Motion
# section reads each fact on its own row. The attribute spelling resolves
# in the container scope's own slot, so `animation="fade_in"` names this
# family on <pb-container> and the block family on a block tag.
#
# Every entrance plays when the band scrolls into view, not at render:
# `timeline-trigger: --in-view view() entry 20% exit 100%` names a
# view-timeline trigger whose activation range runs from the point where
# 20% of the container has entered the scrollport until it has fully
# left, and `animation-trigger: --in-view play-once` binds the entrance
# to it (the Motion group's curated pair, the Animation Triggers draft's
# spelling). The end point is part of the WHEN: a lone start natively
# activates only while the container crosses its entry band, so a band
# already in view when the trigger is created would never play; with
# `exit 100%` a band above the fold plays at load and one below it waits.
# A wearer overrides either property to change how far in (keep the
# `exit 100%` end) or to replay every time, keeping the `--in-view` name
# so the pair stays bound; the reduced-motion unset already kills the
# animation, so the trigger needs no work there. Where the browser lacks
# `animation-trigger`, the printer's `@supports not` hold and the
# daedalus_stylish/motion_triggers runtime play the same role.
container_fade_in:
  label: 'Fade in'
  scope: 'kind:container'
  axis: 'animation'
  description: 'Fade the container in over 600ms when it scrolls into view. The quietest entrance for a page band; off under a reduced-motion preference.'
  styles:
    '':
      default:
        animation-name: 'motion-fade_in'
        animation-duration: '600ms'
        animation-timing-function: 'ease-out'
        animation-fill-mode: 'both'
        timeline-trigger: '--in-view view() entry 20% exit 100%'
        animation-trigger: '--in-view play-once'
      reduced-motion:
        animation: 'none'
container_rise:
  label: 'Rise'
  scope: 'kind:container'
  axis: 'animation'
  description: 'Fade the container in while it drifts up 1rem into place over 600ms when it scrolls into view. Reach for it on a page band that should arrive with a little lift; off under a reduced-motion preference.'
  styles:
    '':
      default:
        animation-name: 'motion-rise'
        animation-duration: '600ms'
        animation-timing-function: 'ease-out'
        animation-fill-mode: 'both'
        timeline-trigger: '--in-view view() entry 20% exit 100%'
        animation-trigger: '--in-view play-once'
      reduced-motion:
        animation: 'none'
container_scale_in:
  label: 'Scale in'
  scope: 'kind:container'
  axis: 'animation'
  description: 'Fade the container in while it grows from 96% to full size over 500ms when it scrolls into view. Reach for it on a hero or a color-blocked band that should pop into place; off under a reduced-motion preference.'
  styles:
    '':
      default:
        animation-name: 'motion-scale_in'
        animation-duration: '500ms'
        animation-timing-function: 'ease-out'
        animation-fill-mode: 'both'
        timeline-trigger: '--in-view view() entry 20% exit 100%'
        animation-trigger: '--in-view play-once'
      reduced-motion:
        animation: 'none'

# The hover axis (declared after animation on the universal container
# kind): hover FEEL as material on its own axis, the block family's twin
# (block_lift in daedalus_stylish.daedalus_stylish.variants.yml). A wear is unconditioned
# by construction, so the variant carries its own WHEN inside its styles:
# the rest state's transition under `default`, the moved state under
# `hover`; the wear bar's Hover row, posed Hover, shows that block. The
# one-per-axis rule keeps an entrance and a hover feel apart, so a band
# wears both at once. Literal values only, and the variant's own
# reduced-motion unset for what it set (the transition and the
# transform); a shadow swap is not motion, so the shadow stays.
container_lift:
  label: 'Lift'
  scope: 'kind:container'
  axis: 'hover'
  description: 'Raise the container 4px with a soft shadow while the pointer hovers it, easing over 150ms. Reach for it on a card-like band or a linked panel that should feel pressable; still under a reduced-motion preference.'
  styles:
    '':
      default:
        transition: 'transform 150ms ease-out, box-shadow 150ms ease-out'
      hover:
        transform: 'translateY(-4px)'
        box-shadow: '0 8px 24px rgb(0 0 0 / 0.12)'
      reduced-motion:
        transition: 'none'
        transform: 'none'
