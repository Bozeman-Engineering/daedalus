services:
  daedalus_stylish_layouts.container_migration:
    class: Drupal\daedalus_stylish_layouts\ContainerMigration
    arguments:
      - '@plugin.manager.daedalus_stylish_condition_type'
      - '@entity_type.manager'
      - '@logger.factory'
  Drupal\daedalus_stylish_layouts\ContainerMigration: '@daedalus_stylish_layouts.container_migration'

  # The container-model migration rides daedalus_layout's transform spine: the
  # section transform converts the four retired multi-region layouts, the
  # host sweep renames the map grammar afterwards. Both stay registered
  # permanently (the LayoutBlockToSectionTransform posture) so stale
  # tempstore sessions keep converging. On sites without daedalus_layout the tags
  # are never collected and the services never instantiate.
  daedalus_stylish_layouts.multi_region_section_transform:
    class: Drupal\daedalus_stylish_layouts\MultiRegionSectionTransform
    arguments:
      - '@daedalus_stylish_layouts.container_migration'
      - '@uuid'
      - '@logger.factory'
      - '@daedalus_blueprint.host_resolver'
    tags:
      - { name: daedalus_layout.section_transform }

  daedalus_stylish_layouts.container_grammar_sweep:
    class: Drupal\daedalus_stylish_layouts\ContainerGrammarSweep
    arguments:
      - '@daedalus_stylish_layouts.container_migration'
    tags:
      - { name: daedalus_layout.host_transform }

  # The proportions retirement (mode + share) runs AFTER the grammar sweep
  # (lower priority): by then the map speaks the container grammar and
  # retiring references have landed on their split_* spellings, so one
  # host pass converges old data all the way to the columns variant.
  daedalus_stylish_layouts.row_arrangement_sweep:
    class: Drupal\daedalus_stylish_layouts\RowArrangementSweep
    arguments:
      - '@daedalus_stylish_layouts.container_migration'
      - '@entity_field.manager'
    tags:
      - { name: daedalus_layout.host_transform, priority: -10 }

  # A variant machine-name rename across every store (host maps, variant
  # styles) plus the old shipped entity's retirement.
  # Its host sweep (VariantRenameSweep) is built per walk inside the
  # service with a private registry, never tagged: a rename is a one-shot.
  daedalus_stylish_layouts.variant_rename:
    class: Drupal\daedalus_stylish_layouts\VariantRename
    arguments:
      - '@entity_type.manager'
      - '@entity_field.manager'
      - '@logger.factory'
      - '@daedalus_blueprint.host_resolver'
  Drupal\daedalus_stylish_layouts\VariantRename: '@daedalus_stylish_layouts.variant_rename'

  daedalus_stylish_layouts.container_part_hoist:
    class: Drupal\daedalus_stylish_layouts\ContainerPartHoist
    arguments:
      - '@entity_type.manager'
      - '@logger.factory'
  Drupal\daedalus_stylish_layouts\ContainerPartHoist: '@daedalus_stylish_layouts.container_part_hoist'

  # The one-box convergence runs AFTER the row sweep (lower priority): the
  # row sweep still reads the part key to parse stepper tracks, so the
  # hoist may only fold what survives it onto the root key. Above the
  # width-band sweep so the part key stays a container-model concern; the
  # condition fold is orthogonal either way. Registered permanently (the
  # ContainerGrammarSweep posture) so stale tempstore sessions keep
  # converging after the part is gone from the declaration.
  daedalus_stylish_layouts.container_part_hoist_sweep:
    class: Drupal\daedalus_stylish_layouts\ContainerPartHoistSweep
    arguments:
      - '@daedalus_stylish_layouts.container_part_hoist'
    tags:
      - { name: daedalus_layout.host_transform, priority: -15 }
