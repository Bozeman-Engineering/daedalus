create variants:
  title: 'Create style variants'
  description: "Save an element's styles as a named, reusable style variant."
update variants:
  title: 'Update style variants'
  description: 'Push an element''s styles back into a variant, updating every use of it site-wide (workspace-staged on workspace sites).'
delete variants:
  title: 'Delete style variants'
  description: 'Delete style variants nothing currently wears. Deleting a variant content wears additionally requires "Delete style variants in use".'
delete variants in use:
  title: 'Delete style variants in use'
  description: 'Delete style variants content currently wears: every wearer is detached first (each keeps the variant''s delivered look as its own styles), then the variant is deleted.'
administer variants:
  title: 'Administer style variants'
  description: 'Edit, delete, and manage all style variants, including unpublished ones.'
create swatches:
  title: 'Create swatches'
  description: 'Mint new palette swatches — named colors and gradients the whole site may reference. On strict style-guide sites this extends the curated vocabulary, so it is part of style-guide enforcement, not convenience.'
update swatches:
  title: 'Update swatches'
  description: 'Edit a swatch''s value, rename it, or restore a revision — restyling every element that references it site-wide (workspace-staged on workspace sites).'
delete swatches:
  title: 'Delete swatches'
  description: 'Delete swatches nothing currently references. Deleting a swatch content references additionally requires "Delete swatches in use".'
delete swatches in use:
  title: 'Delete swatches in use'
  description: 'Delete swatches content currently references: every var() reference is rewritten to the swatch''s literal value first, then the swatch is deleted.'
administer swatches:
  title: 'Administer swatches'
  description: 'Edit, delete, and manage all swatches, including unpublished ones.'
create tokens:
  title: 'Create tokens'
  description: 'Mint new design tokens on the active skin, extending its scales. On a consuming site the token lands in the skin''s site layer over what the package ships. On strict style-guide sites this extends the curated vocabulary, so it is part of style-guide enforcement, not convenience.'
update tokens:
  title: 'Update tokens'
  description: 'Change a token''s value, description or offered flag, restyling every element that references it site-wide (workspace-staged on workspace sites). On a consuming site the change is the site''s layer over the shipped token; removing it reveals the shipped value again.'
delete tokens:
  title: 'Delete tokens'
  description: 'Delete tokens nothing currently references, and drop the site''s changes to a shipped token. Deleting a token content references additionally requires "Delete tokens in use"; a shipped token itself cannot be deleted on a consuming site.'
delete tokens in use:
  title: 'Delete tokens in use'
  description: 'Delete tokens content currently references: every var() reference is rewritten to the token''s literal value first, then the token is deleted.'
edit skin defaults:
  title: 'Edit skin defaults'
  description: 'Set the active skin''s site element defaults through the update_default operation (how every h2, container or menu block looks before any element is styled). On a consuming site the change is the site''s layer over what the package ships; unsetting it reveals the shipped value again.'
administer skins:
  title: 'Administer skins'
  description: 'Create, edit, delete, and activate skins — the site''s design tokens as data. Editing the active skin restyles the whole site. Grants every token gesture and the defaults gesture too.'
  restrict access: true
create animations:
  title: 'Create animations'
  description: 'Mint new animations — named keyframes the whole site may wear. On strict style-guide sites this extends the curated vocabulary, so it is part of style-guide enforcement, not convenience.'
update animations:
  title: 'Update animations'
  description: 'Edit an animation''s steps, rename it, or restore a revision — restyling every element wearing it site-wide (workspace-staged on workspace sites).'
delete animations:
  title: 'Delete animations'
  description: 'Delete animations nothing currently wears. Deleting an animation content wears additionally requires "Delete animations in use".'
delete animations in use:
  title: 'Delete animations in use'
  description: 'Delete animations content currently wears: every reference is rewritten to "none" first, then the animation is deleted.'
administer animations:
  title: 'Administer animations'
  description: 'Edit, delete, and manage all animations, including unpublished ones.'
create fonts:
  title: 'Create fonts'
  description: 'Mint new fonts from uploaded font files — self-hosted families the whole site may name in a font-family stack. On strict style-guide sites this extends the curated vocabulary, so it is part of style-guide enforcement, not convenience.'
update fonts:
  title: 'Update fonts'
  description: 'Edit a font''s faces or family name, rename it, or restore a revision — restyling every element set in the family site-wide (workspace-staged on workspace sites).'
delete fonts:
  title: 'Delete fonts'
  description: 'Delete fonts nothing currently names. Deleting a font content names additionally requires "Delete fonts in use".'
delete fonts in use:
  title: 'Delete fonts in use'
  description: 'Delete fonts content currently names: every font-family reference is rewritten without the family first, then the font is deleted.'
administer fonts:
  title: 'Administer fonts'
  description: 'Edit, delete, and manage all fonts, including unpublished ones.'
# The style half of the role axis (the spine's capability resolver asks it
# for every style write): the umbrella here, and one "style {bundle} {type}
# elements" per bundle with a style store from the callback, mirroring
# core's Layout Builder override permissions, which govern structure.
style any elements:
  title: 'Style any elements'
  description: 'Write styles and variants onto the elements of any page, whatever its bundle. The per-bundle "Style elements" permissions grant the same on one bundle.'
  restrict access: true

permission_callbacks:
  - Drupal\daedalus_stylish\Capability\StylePermissions::permissions
