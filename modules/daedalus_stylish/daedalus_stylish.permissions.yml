create variants:
  title: 'Create style variants'
  description: "Save an element's styles as a named, reusable style variant."
update variants:
  title: 'Update style variants'
  description: 'Push an element''s styles back into a variant, updating every use of it site-wide (workspace-staged on workspace sites).'
delete variants:
  title: 'Delete style variants'
  description: 'Delete style variants nothing currently wears. Deleting a variant content wears additionally requires "Delete style variants in use".'
delete variants in use:
  title: 'Delete style variants in use'
  description: 'Delete style variants content currently wears: every wearer is detached first (each keeps the variant''s delivered look as its own styles), then the variant is deleted.'
administer variants:
  title: 'Administer style variants'
  description: 'Edit, delete, and manage all style variants, including unpublished ones.'
create skin materials:
  title: 'Create skin materials'
  description: 'Mint new tokens, animations and fonts on the active skin: a token extends one of its scales, an animation its motion, a font (from uploaded files) its type. On a consuming site the material lands in the skin''s site layer over what the package ships. On strict style-guide sites this extends the curated vocabulary, so it is part of style-guide enforcement, not convenience.'
update skin materials:
  title: 'Update skin materials'
  description: 'Change a token''s value, an animation''s steps, a font''s faces or family, or a material''s description or offered flag, restyling every element that references it site-wide (workspace-staged on workspace sites). On a consuming site the change is the site''s layer over the shipped record; removing it reveals the shipped record again.'
delete skin materials:
  title: 'Delete skin materials'
  description: 'Delete tokens, animations and fonts nothing currently references, and drop the site''s changes to a shipped one. Deleting a material content references additionally requires "Delete skin materials in use"; a shipped material itself cannot be deleted on a consuming site.'
delete skin materials in use:
  title: 'Delete skin materials in use'
  description: 'Delete tokens, animations and fonts content currently references: every var() reference is rewritten to the token''s literal value, every keyframes reference to "none", every font-family stack loses the family, first; then the material is deleted.'
edit skin defaults:
  title: 'Edit skin defaults'
  description: 'Set the active skin''s site element defaults through the update_default operation (how every h2, container or menu block looks before any element is styled). On a consuming site the change is the site''s layer over what the package ships; unsetting it reveals the shipped value again.'
administer skins:
  title: 'Administer skins'
  description: 'Create, edit, delete, and activate skins — the site''s tokens, animations, fonts and defaults as data. Editing the active skin restyles the whole site. Grants every skin material gesture and the defaults gesture too.'
  restrict access: true
view style law:
  title: 'View the style law'
  description: 'See the inspector''s Law tab (the style guide read-only: scales, bindings, grants, constraints and defaults with the file that supplied each) and the "See the declaration" doorway from a row whose value a declaration supplies. The law is authored in files; this shows it. Granted to no role by default: an administrator role holds it as it holds every permission.'
  restrict access: true
# The style half of the role axis (the spine's capability resolver asks it
# for every style write): the umbrella here, and one "style {bundle} {type}
# elements" per bundle with a style store from the callback, mirroring
# core's Layout Builder override permissions, which govern structure.
style any elements:
  title: 'Style any elements'
  description: 'Write styles and variants onto the elements of any page, whatever its bundle. The per-bundle "Style elements" permissions grant the same on one bundle.'
  restrict access: true

permission_callbacks:
  - Drupal\daedalus_stylish\Capability\StylePermissions::permissions
