      - { name: event_subscriber }
  daedalus_stylish.defaults_settings_subscriber:
    class: Drupal\daedalus_stylish\EventSubscriber\DefaultsSettingsSubscriber
    # Breakpoint thresholds, the container_roots gate and the default theme
    # bake into the defaults file; which skin prints is the design-system
    # switch's business, except the site's skin CHOICE for the active
    # system (skin_choice), which lives in this config and swaps the
    # active skin's tokens: the roster drops and both skins' token ids
    # ride the materials delta, as on a switch.
    arguments:
      - '@daedalus_stylish.defaults_stylesheet'
      - '@daedalus_blueprint.active_design_system'
      - '@daedalus_stylish.skin_manager'
      - '@daedalus_stylish.materials_provider'
      - '@daedalus_blueprint.materials_roster_builder'
      - '@daedalus_blueprint.materials_change_set'
      - '@entity_type.manager'
    tags:
      - { name: event_subscriber }
  daedalus_stylish.design_system_switch_subscriber:
    class: Drupal\daedalus_stylish\EventSubscriber\DesignSystemSwitchSubscriber
    # A switch drops the roster memo and the style guide (the layered
    # declarations with it, so the incoming package's law is in force
    # whatever order the subscribers on the event run in), syncs the
    # incoming system's package under that law, rides both systems' token
    # and member ids on the response's materials delta, and recompiles
    # the three roster-fed files (defaults, variants, swatches).
    arguments:
      - '@daedalus_stylish.defaults_stylesheet'
      - '@daedalus_stylish.variant_stylesheet'
      - '@daedalus_stylish.swatch_stylesheet'
      - '@daedalus_blueprint.materials_roster_builder'
      - '@daedalus_blueprint.materials_change_set'
      - '@daedalus_stylish.skin_manager'
      - '@daedalus_stylish.materials_provider'
      - '@entity_type.manager'
      - '@daedalus_stylish.style_guide'
      - '@daedalus_stylish.shipped_sync'
    tags:
      - { name: event_subscriber }
  daedalus_stylish.style_backend.css:
    class: Drupal\daedalus_stylish\CssStyleBackend
    arguments:
      - '@daedalus_stylish.css_printer'
      - '@plugin.manager.daedalus_stylish_condition_type'
      - '@daedalus_stylish.variant_stylesheet'
      # Media tokens in the delivered map resolve pre-print, against the
      # host whose map it is.
      - '@daedalus_stylish.media_value_resolver'
      # The map prints in its canonical order, the host's document order
      # (NodeTreeBuilder::styleMapOf()), never the stored write order.
      - '@daedalus_blueprint.node_tree_builder'
      # Optional only for kernel tests that boot without daedalus_ui;
      # the module dependency makes it always present on a real site.
      # Branches variant delivery: edit mode resolves references inline at
      # their key roots, live mode keeps class + compiled stylesheet.
      - '@?daedalus_ui.mode_state'
  # The active style backend. Alternative backends (utility classes, etc.)
  # override this alias; the data model never changes.
  daedalus_stylish.style_backend:
    alias: daedalus_stylish.style_backend.css
  daedalus_stylish.width_band_migration:
    class: Drupal\daedalus_stylish\WidthBandMigration
    arguments:
      - '@plugin.manager.daedalus_stylish_condition_type'
      - '@entity_type.manager'
      - '@logger.factory'
  Drupal\daedalus_stylish\WidthBandMigration: '@daedalus_stylish.width_band_migration'

  # The width-band migration rides daedalus_layout's transform spine so the
  # presave/load-time safety net keeps stale tempstore sessions converging
  # after the "wide" condition retired. Registered permanently (the
  # ContainerGrammarSweep posture); priority below daedalus_stylish_layouts' sweeps
  # so a truly stale map speaks the container grammar before wide folds.
  # On sites without daedalus_layout the tag is never collected and the service
  # never instantiates.
  daedalus_stylish.width_band_sweep:
    class: Drupal\daedalus_stylish\WidthBandSweep
    arguments:
      - '@daedalus_stylish.width_band_migration'
    tags:
      - { name: daedalus_layout.host_transform, priority: -20 }

  daedalus_stylish.relative_selector_convergence:
    class: Drupal\daedalus_stylish\RelativeSelectorConvergence
    arguments:
      - '@entity_type.manager'
      - '@logger.factory'
  Drupal\daedalus_stylish\RelativeSelectorConvergence: '@daedalus_stylish.relative_selector_convergence'

  # The relative selector grammar's convergence: every "::" suffix in its
  # one canonical spelling (the retired "::>" children spelling rewritten
  # to "::> *"). Registered permanently and LAST among the sweeps, so the
  # container hoist's children entry converges in the same pass.
  daedalus_stylish.relative_selector_sweep:
    class: Drupal\daedalus_stylish\RelativeSelectorSweep
    arguments:
      - '@daedalus_stylish.relative_selector_convergence'
    tags:
      - { name: daedalus_layout.host_transform, priority: -25 }

  daedalus_stylish.form_alter.bundle_edit:
    class: Drupal\daedalus_stylish\Form\BundleEditFormAlter
    arguments: ['@daedalus_stylish.field_manager', '@entity_type.manager', '@daedalus_ui.form_alter.bundle_edit']
  # The design system form's default_skin: daedalus_blueprint keeps the
  # free-text machine name (it knows no skins); this narrows it to a
  # select of the system's member skins.
  daedalus_stylish.form_alter.design_system:
    class: Drupal\daedalus_stylish\Form\DesignSystemFormAlter
    arguments: ['@daedalus_stylish.skin_manager']
  # Daedalus Stylish's materials provider: the active skin's tokens, the published
  # swatches, the published variants and the published animations as
  # roster records (the ONE place these four kinds are read into the
  # materials spine; spellings derive from the declarations here and
  # nowhere else).
  daedalus_stylish.materials_provider:
    class: Drupal\daedalus_stylish\Materials\DaedalusStylishMaterialsProvider
    arguments:
      - '@daedalus_stylish.style_guide'
      - '@daedalus_stylish.skin_manager'
      # Theme resolution: the declaration spine's one answer (siteTheme()).
      - '@daedalus_ui.page_builder_declarations'
      - '@daedalus_stylish.swatch_repository'
      - '@daedalus_stylish.variant_repository'
      - '@daedalus_stylish.animation_repository'
      # The gesture lane (save_material / update_material / remove_material
      # with kind swatch, variant or animation): the managers and the
      # capture walk, as closures because the dependency is circular by
      # construction (the managers validate through StyleMapValidator,
      # whose universe is the roster this provider feeds).
      - !service_closure '@daedalus_stylish.swatch_manager'
      - !service_closure '@daedalus_stylish.variant_manager'
      - !service_closure '@daedalus_stylish.animation_manager'
      - !service_closure '@daedalus_stylish.variant_capture'
      - '@current_user'
      - '@config.factory'
      # A closure: the element read walks the lean tree through the field
      # handlers, whose validator reads the roster this provider feeds.
      - !service_closure '@daedalus_blueprint.element_materials'
      - '@daedalus_blueprint.value_grammar'
      # The roster is what this provider feeds: a closure, never a direct
      # dependency (the collector would recurse).
      - !service_closure '@daedalus_blueprint.materials_roster_builder'
      # The verdict the variant records are filtered by.
      - '@daedalus_stylish.variant_conformance'
      # The distro lock: a shipped swatch, variant or animation record is
      # `updatable` only once the developer gate (settings.php) lifts it.
      - '@daedalus_blueprint.distro_lock'
      # The token gestures (kind token): a closure like the other managers,
      # its validator's universe being the roster this provider feeds.
      - !service_closure '@daedalus_stylish.token_manager'
      # The font records and the font gestures (kind font): the repository
      # direct, the manager a closure like the others.
      - '@daedalus_stylish.font_repository'
      - !service_closure '@daedalus_stylish.font_manager'
    tags:
      - { name: daedalus_blueprint.materials_provider }
  # The token gestures: mint, update and delete one token of the active
  # skin, in the layer the site may write (the site layer on a consuming
  # site, the package layer on the site's own skin or under the developer
  # gate). The materials provider dispatches save_material /
  # update_material / remove_material with kind token here.
  daedalus_stylish.token_manager:
    class: Drupal\daedalus_stylish\TokenManager
    arguments:
      # The token seam every write validates the merged layers through.
      - '@daedalus_stylish.style_map_validator'
      # The active skin, the one every token gesture addresses, and the
      # layer rule (SkinManager::writesSiteLayer()) every skin write shares.
      - '@daedalus_stylish.skin_manager'
      - '@current_user'
      # Compound condition keys canonicalize (part order) on write.
      - '@plugin.manager.daedalus_stylish_condition_type'
      # The scale declarations a token's custom property derives under
      # (StyleGuide::tokenVariable()), the usage lane's reference form.
      - '@daedalus_stylish.style_guide'
      # The usage table: the count behind the palette row and the
      # rewrite batches' work lists.
      - '@daedalus_stylish.token_usage'
      # The disk lane: the revert gesture and the shipped state read "what
      # does the provider ship for this token right now" through the
      # importer.
      - '@daedalus_stylish.skin_importer'
  daedalus_stylish.token_usage:
    # The daedalus_token_usage table: which source entities reference
    # which custom properties (a token's var(--{prefix}-{name})) inside
    # their saved default-revision CSS values, mirrored at the entity save
    # chokepoint across the three stores; the swatch table's twin for the
    # material that lives on the skin.
    class: Drupal\daedalus_stylish\TokenUsage
    arguments:
      - '@database'
      - '@entity_type.manager'
      - '@entity_field.manager'
      - '@daedalus_blueprint.host_resolver'
  Drupal\daedalus_stylish\TokenManager: '@daedalus_stylish.token_manager'
  Drupal\daedalus_stylish\Materials\DaedalusStylishMaterialsProvider: '@daedalus_stylish.materials_provider'
  # The offered variants the site's CURRENT law refuses, judged once per
  # law change (cache-backed under the provider's tags) and withheld from
  # the roster by the provider; the request memo resets with the variant
  # repository's.
  daedalus_stylish.variant_conformance:
    class: Drupal\daedalus_stylish\VariantConformance
    arguments:
      # Closures both ways: the provider withholds this verdict, and the
      # validator's universe is the roster the provider feeds.
      - !service_closure '@daedalus_stylish.materials_provider'
      - !service_closure '@daedalus_stylish.style_map_validator'
      - '@daedalus_stylish.variant_repository'
      - '@daedalus_blueprint.active_design_system'
      - '@daedalus_stylish.style_guide'
      - '@daedalus_ui.page_builder_declarations'
      - '@cache.default'
      - '@?workspaces.manager'
  Drupal\daedalus_stylish\VariantConformance: '@daedalus_stylish.variant_conformance'
  # Whether one skin mints every name the guide's token contract
  # promises (site.token_contract), and what it lacks per scale: the
  # skin's half of the contract, the guide build proving the other
  # (every curated stop is a contract name).
  daedalus_stylish.skin_conformance:
    class: Drupal\daedalus_stylish\SkinConformance
    arguments:
      - '@daedalus_stylish.style_guide'
  Drupal\daedalus_stylish\SkinConformance: '@daedalus_stylish.skin_conformance'
  # The server capture of an element's look for save_material /
  # update_material with kind variant (the AI's door; the client's
  # variant-scope.js captureEntries()/saveStyles() is its twin for live
  # preview): the element's own overrides, its parts, its staged children by
  # slot path, the same-axis look it wears folded beneath.
  daedalus_stylish.variant_capture:
    class: Drupal\daedalus_stylish\VariantCapture
    arguments:
      - '@daedalus_stylish.style_map_validator'
      - '@daedalus_stylish.subtree_slot_keys'
  # Contributes daedalus_stylish's declarations (axis order per scope, conditions,
  # parts, instance namespaces, closed-world stylable rosters) to
  # daedalus_blueprint's dialect catalog; the materials themselves ride the
  # roster through daedalus_stylish.materials_provider.
  daedalus_stylish.dialect_vocabulary_subscriber:
    class: Drupal\daedalus_stylish\EventSubscriber\DialectVocabularySubscriber
    arguments:
      - '@plugin.manager.daedalus_stylish_condition_type'
      - '@daedalus_stylish.style_guide'
      # The stylable rosters the catalog carries are the vocabulary
      # roster's, one per kind.
      - '@daedalus_stylish.vocabulary_roster'
      - '@daedalus_ui.page_builder_declarations'
      # The dressed tags are the active skin's base default scopes.
      - '@daedalus_stylish.skin_manager'
    tags:
      - { name: event_subscriber }
  daedalus_stylish.component_styles_subscriber:
    class: Drupal\daedalus_stylish\EventSubscriber\ElementStylesSubscriber
    arguments:
      - '@daedalus_stylish.style_guide'
      - '@daedalus_stylish.style_map_validator'
      - '@theme_handler'
      - '@daedalus_blueprint.element_locator'
      # The depth stamp a move's strip reads (MaterialRecord::rootOnly()).
      - '@daedalus_blueprint.materials_roster_builder'
    tags:
      - { name: event_subscriber }
