services:
  daedalus_stylish.field_manager:
    class: Drupal\daedalus_stylish\DaedalusStylishFieldManager
    arguments: ['@entity_type.manager', '@config.factory']
  # The styling gate's sweep for the recipe pipeline, which installs and
  # imports under the syncing flag and so fires neither hook_install's
  # sweep nor the gate-carrier hooks.
  daedalus_stylish.recipe_applied_subscriber:
    class: Drupal\daedalus_stylish\EventSubscriber\RecipeAppliedSubscriber
    arguments: ['@daedalus_stylish.field_manager']
    tags:
      - { name: event_subscriber }
  plugin.manager.daedalus_stylish_property_group:
    class: Drupal\daedalus_stylish\PropertyGroupPluginManager
    parent: default_plugin_manager
  plugin.manager.daedalus_stylish_control_widget:
    class: Drupal\daedalus_stylish\ControlWidgetPluginManager
    parent: default_plugin_manager
  plugin.manager.daedalus_stylish_condition_type:
    class: Drupal\daedalus_stylish\ConditionTypePluginManager
    arguments:
      - '@container.namespaces'
      - '@cache.discovery'
      - '@module_handler'
      - '@config.factory'
  daedalus_stylish.style_guide:
    class: Drupal\daedalus_stylish\StyleGuide
    arguments:
      # Discovery and layering live at the page builder declaration spine;
      # daedalus_stylish projects the styling sections and validates its own controls.
      - '@daedalus_ui.page_builder_declarations'
      - '@theme.manager'
      # Enforcement is the active design system's: the guide reads the
      # mode off the entity the pointer names, guarded with none active.
      - '@daedalus_blueprint.active_design_system'
      - '@plugin.manager.daedalus_stylish_control_widget'
      - '@plugin.manager.daedalus_stylish_property_group'
      # Lazy: the validator injects this guide; the guide's build check of
      # declared defaults reaches the validator through the closure.
      - !service_closure '@daedalus_stylish.style_map_validator'
      # Lazy for the same reason: the roster builder injects this guide,
      # and resetCache() drops its memo with the declarations.
      - !service_closure '@daedalus_stylish.vocabulary_roster'
      # The build check of a declaration's pseudo section keys by the
      # pseudo-elements the browser knows.
      - '@daedalus_stylish.wide_selectors'
  # The vocabulary roster: what one address may style, resolved once per
  # request from the layered declarations and the enforcement mode (the
  # twin of daedalus_blueprint.materials_roster_builder).
  daedalus_stylish.vocabulary_roster:
    class: Drupal\daedalus_stylish\Vocabulary\VocabularyRosterBuilder
    arguments:
      - '@daedalus_stylish.style_guide'
      - '@plugin.manager.daedalus_stylish_property_group'
      - '@plugin.manager.daedalus_stylish_condition_type'
      - '@daedalus_ui.page_builder_declarations'
      - '@theme.manager'
      # The applicable materials are read from the materials roster at
      # call time, so this memo needs no workspace key.
      - '@daedalus_blueprint.materials_roster_builder'
      - '@daedalus_stylish.wide_selectors'
      - '@daedalus_stylish.pseudo_vocabularies'
  # The per-pseudo-element vocabularies (data/pseudo-vocabularies.json, the
  # one server reader): the properties the browser styles on ::marker,
  # ::placeholder, ::selection, ::first-letter and ::first-line. The roster
  # grants a table pseudo-element from it; the validator refuses a property
  # outside it in every mode, as the browser would ignore it.
  daedalus_stylish.pseudo_vocabularies:
    class: Drupal\daedalus_stylish\Vocabulary\PseudoVocabularies
    arguments:
      - '@extension.list.module'
  # The wide selector tier: what the browser knows (data/wide-selectors.json,
  # the one server reader). The universe admission is judged against, never
  # a grant: a selector word outside it is a typo in every mode.
  daedalus_stylish.wide_selectors:
    class: Drupal\daedalus_stylish\Vocabulary\WideSelectors
    arguments:
      - '@extension.list.module'
  # The wide condition tier: the media and container features the browser
  # knows, with their value spaces (data/wide-conditions.json, the one
  # server reader). The universe a literal condition clause is judged
  # against, never a grant: strict admits references only, open and
  # guarded admit a literal the tier knows, a typo is refused everywhere.
  daedalus_stylish.wide_conditions:
    class: Drupal\daedalus_stylish\Vocabulary\WideConditions
    arguments:
      - '@extension.list.module'
  # The rosters' value spaces: the site-wide bindings per property and the
  # deviations per address (the places narrowing below a binding), derived
  # once for the JSON door's style_guide (the field handlers) and the
  # design system brief (through the dialect catalog's build event).
  daedalus_stylish.vocabulary_value_spaces:
    class: Drupal\daedalus_stylish\Vocabulary\VocabularyValueSpaces
    arguments:
      - '@daedalus_stylish.style_guide'
      - '@daedalus_stylish.vocabulary_roster'
  # The inspector's gesture gates: one read of the current user's variant,
  # token, animation, font, skin and law grants for both hosts (the sidebar
  # and the satellite window).
  daedalus_stylish.inspector_gates:
    class: Drupal\daedalus_stylish\InspectorGates
    arguments:
      - '@current_user'
      # The blueprint ownership gate (may the actor edit blueprints of some
      # type), present only with daedalus_blueprint_library.
      - '@?daedalus_blueprint_library.type_access'
  daedalus_stylish.client_style_guide:
    class: Drupal\daedalus_stylish\ClientStyleGuide
    arguments:
      - '@daedalus_stylish.style_guide'
      - '@plugin.manager.daedalus_stylish_property_group'
      - '@plugin.manager.daedalus_stylish_condition_type'
      # Theme resolution: the declaration spine's one answer (siteTheme()).
      - '@daedalus_ui.page_builder_declarations'
      - '@plugin.manager.daedalus_stylish_control_widget'
      # The active skin's site defaults (skin data the inspector's
      # provenance reads; its tokens are materials and ride the roster's
      # delivery payload instead).
      - '@daedalus_stylish.skin_manager'
      # The conformance verdict: the `withheld` payload (the wear bar's
      # stale-row reason for a variant the current law refuses).
      - '@daedalus_stylish.variant_conformance'
      # The vocabulary roster: every served node is the roster's answers
      # at its address (grants, value spaces, axes), never a declaration
      # the client re-derives.
      - '@daedalus_stylish.vocabulary_roster'
      # The block_content bundle labels: a served block type carries its
      # bundle's human name, what the code view labels a type compound by.
      - '@entity_type.bundle.info'
      # The active design system: its id and label head the Design
      # system place (its enforcement mode rides the style guide).
      - '@daedalus_blueprint.active_design_system'
  daedalus_stylish.style_map_validator:
    class: Drupal\daedalus_stylish\StyleMapValidator
    arguments:
      - '@plugin.manager.daedalus_stylish_property_group'
      - '@daedalus_stylish.style_guide'
      - '@theme_handler'
      # Lazy: the locator's dependency chain leads back to our field handler,
      # which injects this validator (see the constructor docblock).
      - !service_closure '@daedalus_blueprint.element_locator'
      - '@plugin.manager.daedalus_stylish_condition_type'
      # The material universes: minted tokens and published variants are
      # the roster's, never walked here.
      - '@daedalus_blueprint.materials_roster_builder'
      # The identity map variant references load entities through
      # (delivery resolves from the innermost render loop).
      - '@daedalus_stylish.variant_repository'
      # The member seam: a design system's member validates in ITS system's
      # universe (the system's default skin, loaded through the skin
      # manager) whether or not it is active.
      - '@entity_type.manager'
      - '@daedalus_stylish.skin_manager'
      # The verdict behind a reference to a withheld variant: the roster
      # answers "not offered", the judge answers why (the refused values).
      - '@daedalus_stylish.variant_conformance'
      # The grant: every entry validates against the vocabulary roster of
      # the address it styles (the one derivation of "what may this
      # address style"), never against a declaration resolved here.
      - '@daedalus_stylish.vocabulary_roster'
      # The universes a LITERAL condition clause is judged against on an
      # open or guarded site: the media and container features with their
      # value spaces, and the pseudo-classes the browser knows.
      - '@daedalus_stylish.wide_conditions'
      - '@daedalus_stylish.wide_selectors'
      # The browser's law on a table pseudo-element's box: a property
      # outside its allowlist is refused in every mode.
      - '@daedalus_stylish.pseudo_vocabularies'
  daedalus_stylish.variant_repository:
    # Request-lifetime identity map behind loadVariant(): each distinct variant
    # reference resolves at most once per request and workspace window (misses
    # included), reset by _daedalus_stylish_variant_change() on any variant save
    # or delete and by VariantWorkspaceSubscriber on publish.
    class: Drupal\daedalus_stylish\VariantRepository
    arguments:
      - '@entity_type.manager'
      # Optional: the memos key on the active workspace, because a compile
      # runs outside it right after a staged save previews inside it.
      - '@?workspaces.manager'
  Drupal\daedalus_stylish\Hook\MaterialsGateHooks:
    # The materials roster and its schema fragment are core's; this hook
    # only lands the provider's minting posture (daedalus_stylish.settings
    # ai_minting; mintPosture(), the one sentence the brief's MINT line
    # also states) on that fragment's guidance for the JSON door, after
    # core landed it.
    class: Drupal\daedalus_stylish\Hook\MaterialsGateHooks
    arguments:
      - '@daedalus_stylish.materials_provider'
  Drupal\daedalus_stylish\Hook\LayoutDefaultsSchemaHooks:
    # Two-door birth semantics as generated schema data: each
    # available_layouts entry whose layout declares default_variants gains
    # one line naming what add_section stamps (with top-level-only limits)
    # and that document-authored sections (page_create, page_edit,
    # eb_create_entity) are never stamped. Derived from
    # the same guide projections the stamping subscriber consumes, so the
    # line cannot drift from what add_section actually writes.
    class: Drupal\daedalus_stylish\Hook\LayoutDefaultsSchemaHooks
    arguments:
      - '@daedalus_stylish.style_guide'
      # Theme resolution: the declaration spine's one answer (siteTheme()).
      - '@daedalus_ui.page_builder_declarations'
  daedalus_stylish.skill_type.skins:
    # The skins skill: live skin catalog + editing recipes. The skill
    # definition's permission key ('administer skins') gates who sees and
    # may invoke it; this type only composes for accounts past that gate.
    class: Drupal\daedalus_stylish\SkillType\SkinsSkillType
    arguments:
      - '@entity_type.manager'
      - '@daedalus_stylish.skin_manager'
      - '@daedalus_stylish.style_guide'
      # Theme resolution: the declaration spine's one answer (siteTheme()).
      - '@daedalus_ui.page_builder_declarations'
    tags:
      - { name: daedalus_blueprint.skill_type, type_id: skins }
  daedalus_stylish.style_stack:
    # The stack projection (the client style stack's server twin): one key's
    # layers in delivery order, the declared and skin tiers beneath the
    # ancestor rules reaching the key (when the caller passes the tree)
    # beneath the worn variants and the element's own entry, raw styles per
    # layer, winners read per condition (linesAt()); read by the AI's
    # explain_element_styles tool.
    class: Drupal\daedalus_stylish\StyleStack
    arguments:
      - '@daedalus_stylish.style_map_validator'
      # Layer facts (label, axis, scope) are the roster record's.
      - '@daedalus_blueprint.materials_roster_builder'
      # The floor's two tiers: the declared defaults per theme, and the
      # active skin's defaults.
      - '@daedalus_stylish.style_guide'
      - '@daedalus_stylish.skin_manager'
      # Theme resolution: the declaration spine's one answer (siteTheme()),
      # resolved once per read for both the reference order and the
      # declared tier.
      - '@daedalus_ui.page_builder_declarations'
  daedalus_stylish.style_value_resolver:
    class: Drupal\daedalus_stylish\StyleValueResolver
    arguments:
      # The handled-value seam: the input tier's object markers. Daedalus Stylish
      # registers none itself; what a marker means is its handler's business.
      - !tagged_iterator daedalus_stylish.style_value_handler
      # The layers gate: the list form is only legal on media-capable
      # properties (the 'media' flag on the owning group's definition).
      - '@plugin.manager.daedalus_stylish_property_group'
  daedalus_stylish.field_handler.style_map:
    class: Drupal\daedalus_stylish\StyleMapFieldHandler
    arguments:
      - '@daedalus_stylish.style_map_validator'
      - '@daedalus_stylish.style_guide'
      # Theme resolution: the declaration spine's one answer (siteTheme()).
      - '@daedalus_ui.page_builder_declarations'
      - '@plugin.manager.daedalus_stylish_condition_type'
      # The input tier's write-time resolution (handled values, layers).
      - '@daedalus_stylish.style_value_resolver'
      # The guidance names blueprints among the materials only while the
      # roster has some (grows-by-data).
      - '@daedalus_blueprint.materials_roster_builder'
      # The rosters the fragment teaches (what each address may style).
      - '@daedalus_stylish.vocabulary_roster'
      # The map's host: the entity being written, resolved so the validator
      # reads block bundles and section layouts through its document.
      - '@daedalus_blueprint.host_resolver'
      # The value spaces the fragment prints (bindings, deviations): the one
      # derivation the dialect catalog carries for the brief.
      - '@daedalus_stylish.vocabulary_value_spaces'
    tags:
      - { name: daedalus_blueprint.field_handler, field_types: 'daedalus_stylish_style_map' }
  daedalus_stylish.field_handler.skin_tokens:
    class: Drupal\daedalus_stylish\SkinTokensFieldHandler
    arguments:
      - '@daedalus_stylish.style_map_validator'
      - '@daedalus_stylish.style_guide'
      # Theme resolution: the declaration spine's one answer (siteTheme()).
      - '@daedalus_ui.page_builder_declarations'
      - '@plugin.manager.daedalus_stylish_condition_type'
      # The input tier's write-time resolution (handled values, layers).
      - '@daedalus_stylish.style_value_resolver'
      # The guidance names blueprints among the materials only while the
      # roster has some (StyleMapFieldHandler::guidanceParagraph()).
      - '@daedalus_blueprint.materials_roster_builder'
      # The rosters the fragment teaches (what each address may style).
      - '@daedalus_stylish.vocabulary_roster'
      - '@daedalus_blueprint.host_resolver'
      # The value spaces the fragment prints (bindings, deviations): the one
      # derivation the dialect catalog carries for the brief.
      - '@daedalus_stylish.vocabulary_value_spaces'
      # Lazy: the importer injects the deserializer, whose handler manager
      # instantiates this handler (the validator's component-locator cycle,
      # again). The distro lock's disk read: does the provider ship this
      # skin right now?
      - !service_closure '@daedalus_stylish.skin_importer'
      # The distro lock gates the package-layer write and the guidance's
      # lock sentence; the developer gate (settings.php) lifts it.
      - '@daedalus_blueprint.distro_lock'
    tags:
      - { name: daedalus_blueprint.field_handler, field_types: 'daedalus_skin_tokens' }
  daedalus_stylish.field_handler.skin_defaults:
    class: Drupal\daedalus_stylish\SkinDefaultsFieldHandler
    arguments:
      - '@daedalus_stylish.style_map_validator'
      - '@daedalus_stylish.style_guide'
      # Theme resolution: the declaration spine's one answer (siteTheme()).
      - '@daedalus_ui.page_builder_declarations'
      - '@plugin.manager.daedalus_stylish_condition_type'
      # The input tier's write-time resolution (handled values, layers).
      - '@daedalus_stylish.style_value_resolver'
      # The guidance names blueprints among the materials only while the
      # roster has some (StyleMapFieldHandler::guidanceParagraph()).
      - '@daedalus_blueprint.materials_roster_builder'
      # The rosters the fragment teaches (what each address may style).
      - '@daedalus_stylish.vocabulary_roster'
      - '@daedalus_blueprint.host_resolver'
      # The value spaces the fragment prints (bindings, deviations): the one
      # derivation the dialect catalog carries for the brief.
      - '@daedalus_stylish.vocabulary_value_spaces'
    tags:
      - { name: daedalus_blueprint.field_handler, field_types: 'daedalus_skin_defaults' }
  daedalus_stylish.field_handler.skin_animations:
    # The blueprint lane's READ of a skin's animations (the package layer
    # as records); every whole-field write refuses and names the material
    # gestures, the defaults handler's posture.
    class: Drupal\daedalus_stylish\SkinAnimationsFieldHandler
    arguments:
      - '@daedalus_stylish.style_map_validator'
      - '@daedalus_stylish.style_guide'
      - '@daedalus_ui.page_builder_declarations'
      - '@plugin.manager.daedalus_stylish_condition_type'
      - '@daedalus_stylish.style_value_resolver'
      - '@daedalus_blueprint.materials_roster_builder'
      - '@daedalus_stylish.vocabulary_roster'
      - '@daedalus_blueprint.host_resolver'
      - '@daedalus_stylish.vocabulary_value_spaces'
    tags:
      - { name: daedalus_blueprint.field_handler, field_types: 'daedalus_skin_animations' }
  daedalus_stylish.field_handler.skin_fonts:
    # The blueprint lane's READ of a skin's fonts (the package layer as
    # records); every whole-field write refuses and names the material
    # gestures, the animations handler's posture.
    class: Drupal\daedalus_stylish\SkinFontsFieldHandler
    arguments:
      - '@daedalus_stylish.style_map_validator'
      - '@daedalus_stylish.style_guide'
      - '@daedalus_ui.page_builder_declarations'
      - '@plugin.manager.daedalus_stylish_condition_type'
      - '@daedalus_stylish.style_value_resolver'
      - '@daedalus_blueprint.materials_roster_builder'
      - '@daedalus_stylish.vocabulary_roster'
      - '@daedalus_blueprint.host_resolver'
      - '@daedalus_stylish.vocabulary_value_spaces'
    tags:
      - { name: daedalus_blueprint.field_handler, field_types: 'daedalus_skin_fonts' }
  daedalus_stylish.skin_manager:
    class: Drupal\daedalus_stylish\SkinManager
    arguments:
      # The active skin is derived: the site's choice for the active
      # design system while the system may wear it, else its default_skin.
      - '@daedalus_blueprint.active_design_system'
      - '@entity_type.manager'
      # Which layer a site write to a skin lands in is the lock's answer:
      # the site layer while it holds on a package's skin, the package
      # layer on the site's own skin or once the developer gate lifts it.
      - '@daedalus_blueprint.distro_lock'
      # The one revisioned save every canvas gesture on a skin takes
      # (saveRevision()): the token gestures and update_default.
      - '@current_user'
      - '@datetime.time'
      # The choice lives in daedalus_stylish.settings skin_choice, keyed by
      # design system id.
      - '@config.factory'
      # A choice is worn only while the skin mints the guide's contract.
      - '@daedalus_stylish.skin_conformance'
  daedalus_stylish.field_handler.variant_styles:
    class: Drupal\daedalus_stylish\VariantStylesFieldHandler
    arguments:
      - '@daedalus_stylish.style_map_validator'
      - '@daedalus_stylish.style_guide'
      # Theme resolution: the declaration spine's one answer (siteTheme()).
      - '@daedalus_ui.page_builder_declarations'
      - '@plugin.manager.daedalus_stylish_condition_type'
      # The input tier's write-time resolution (handled values, layers).
      - '@daedalus_stylish.style_value_resolver'
      # The guidance names blueprints among the materials only while the
      # roster has some (StyleMapFieldHandler::guidanceParagraph()).
      - '@daedalus_blueprint.materials_roster_builder'
      # The rosters the fragment teaches (what each address may style).
      - '@daedalus_stylish.vocabulary_roster'
      - '@daedalus_blueprint.host_resolver'
      # The value spaces the fragment prints (bindings, deviations): the one
      # derivation the dialect catalog carries for the brief.
      - '@daedalus_stylish.vocabulary_value_spaces'
      # Lazy: the importer injects the deserializer, whose handler manager
      # instantiates this handler (the validator's component-locator cycle,
      # again). The distro lock's disk read.
      - !service_closure '@daedalus_stylish.variant_importer'
      # The distro lock gates the blueprint-lane write and the guidance's
      # lock sentence; the developer gate (settings.php) lifts it.
      - '@daedalus_blueprint.distro_lock'
    tags:
      - { name: daedalus_blueprint.field_handler, field_types: 'daedalus_variant_styles' }
  daedalus_stylish.operation_handler:
    class: Drupal\daedalus_stylish\DaedalusStylishOperationHandler
    arguments:
      - '@daedalus_stylish.style_map_validator'
      - '@daedalus_blueprint.access_checker'
      - '@daedalus_stylish.subtree_slot_keys'
      # Compound condition keys canonicalize (part order) on write.
      - '@plugin.manager.daedalus_stylish_condition_type'
      # The input tier's write-time resolution (handled values, layers).
      - '@daedalus_stylish.style_value_resolver'
      # update_default: the active skin, the layer rule
      # (SkinManager::writesSiteLayer()) and the revisioned save every
      # skin gesture shares; the permission gate is the current user's.
      - '@daedalus_stylish.skin_manager'
      - '@current_user'
      # The applicability seam: cross-module vetoes on NEW applies (blueprint
      # ownership first among them), consulted by apply_variant before the
      # write. Daedalus Stylish stays ignorant of what the checkers know.
      - !tagged_iterator daedalus_stylish.variant_applicability_checker
    tags:
      - { name: daedalus_blueprint.operation_handler }
  # The style half of the capability resolver's role axis: style on a
  # content host follows `style {bundle} {type} elements` or `style any
  # elements`, on a template `configure any layout`. Structure and inline
  # block content are the spine's RolePolicy (same tag).
  daedalus_stylish.capability_policy.style:
    class: Drupal\daedalus_stylish\Capability\StylePolicy
    tags:
      - { name: daedalus_blueprint.capability_policy, priority: 30 }
  # The depth half of the applicability seam (blueprint ownership, the other
  # half, registers from daedalus_blueprint_library's service provider): a
  # NEW wearing of a root-only variant on a nested container is refused at
  # the gesture; the fact is the roster record's applies.depth stamp.
  daedalus_stylish.root_only_variant_checker:
    class: Drupal\daedalus_stylish\RootOnlyVariantChecker
    arguments:
      - '@daedalus_stylish.style_map_validator'
      - '@daedalus_blueprint.materials_roster_builder'
      - '@daedalus_blueprint.element_locator'
    tags:
      - { name: daedalus_stylish.variant_applicability_checker }
  daedalus_stylish.subtree_slot_keys:
    class: Drupal\daedalus_stylish\SubtreeSlotKeys
    # The adapter and layout manager are optional only for kernel tests that
    # boot without the layout_builder chain; both ship with daedalus_stylish's hard
    # dependencies on real sites.
    arguments:
      - '@?daedalus_blueprint.daedalus_layout_adapter'
      - '@?plugin.manager.core.layout'
  daedalus_stylish.render_styles:
    # The style maps a rendered entity shows: its own and its render
    # host's (its display's template when it has no override), the one
    # reading CSS delivery and live attribution demand share. daedalus_layout
    # is optional: without it there is no nested content to resolve roots
    # for; the rendered entity is always its own map host.
    class: Drupal\daedalus_stylish\RenderStyles
    arguments:
      - '@daedalus_blueprint.host_resolver'
      - '@?daedalus_layout.root_entity_registry'
  Drupal\daedalus_stylish\RenderStyles: '@daedalus_stylish.render_styles'
  daedalus_stylish.live_attribution:
    class: Drupal\daedalus_stylish\DaedalusStylishLiveAttribution
    arguments:
      - '@daedalus_stylish.render_styles'
    tags:
      - { name: daedalus_ui.live_attribution_provider }
  daedalus_stylish.css_printer:
    class: Drupal\daedalus_stylish\CssPrinter
    arguments:
      - '@daedalus_stylish.style_map_validator'
      - '@plugin.manager.daedalus_stylish_condition_type'
  daedalus_stylish.variant_usage:
    # The daedalus_variant_usage table: which host entities wear which
    # variants, mirrored from the saved default-revision style maps at the
    # host entity save chokepoint (daedalus_stylish_entity_insert/update/delete).
    # Every usage consumer reads it; nothing parses content on demand.
    class: Drupal\daedalus_stylish\VariantUsage
    arguments:
      - '@database'
      - '@entity_type.manager'
      - '@entity_field.manager'
      - '@daedalus_blueprint.host_resolver'
  daedalus_stylish.variant_manager:
    class: Drupal\daedalus_stylish\VariantManager
    arguments:
      - '@daedalus_stylish.style_map_validator'
      - '@entity_type.manager'
      # Usage counts read the daedalus_variant_usage table.
      - '@daedalus_stylish.variant_usage'
      - '@current_user'
      - '@datetime.time'
      # The disk lane: the shipped-state comparisons and the revert gesture
      # read "what does the provider ship right now" through the importer.
      - '@daedalus_stylish.variant_importer'
      # A mint joins the active design system unless it opts out (global).
      - '@daedalus_blueprint.active_design_system'
      # The distro lock: shipped variants are read-only while it holds; the
      # developer gate (settings.php) lifts it on an authoring site.
      - '@daedalus_blueprint.distro_lock'
      # The host resolver: a gesture's page resolves to its host.
      - '@daedalus_blueprint.host_resolver'
      # Optional: with daedalus_tempstore the gestures resolve the host entity's
      # STAGED copy, so scope capture sees just-placed blocks.
      - '@?daedalus_tempstore.entity_tempstore_repository'
      # Optional: with daedalus_blueprint_library, file-owned variants (the
      # blueprint_file lane) resolve their owner against blueprint discovery.
      - '@?daedalus_blueprint_library.discovery'
  daedalus_stylish.admin_account_switcher:
    # The sync path's administrative account switch: core's default-content
    # switcher class, declared here as a PUBLIC service of this module rather
    # than consumed as core's own private one
    # (Drupal\Core\DefaultContent\AdminAccountSwitcher, public: false). A
    # multi-module install (core 11.4's RecipeRunner installs a recipe's whole
    # list in one ModuleInstaller::install() call) ends with
    # DrupalKernel::resetContainer(), whose Container::reset() drops every
    # public service instance but keeps the private ones; a private switcher
    # built mid-install (the config-save subscriber below pulls the importers
    # in on the first config save) survives the reset wrapping the OLD
    # account_switcher and current_user, and the hook_modules_installed sync
    # then switches a dead AccountProxy while the fresh access checker reads
    # the live one: every shipped definition fails ACCESS_DENIED_ENTITY. A
    # public service is renewed with the container, so the switch and the
    # check always share one current_user.
    class: Drupal\Core\DefaultContent\AdminAccountSwitcher
    arguments:
      - '@account_switcher'
      - '@entity_type.manager'
      - '%security.enable_super_user%'
  daedalus_stylish.variant_importer:
    class: Drupal\daedalus_stylish\VariantImporter
    arguments:
      - '@module_handler'
      - '@entity_type.manager'
      - '@daedalus_blueprint.deserializer'
      # Shipped variants are code, not user input: the import runs as an
      # administrative account (core's default-content precedent), because
      # module installs often run as the anonymous CLI user.
      - '@daedalus_stylish.admin_account_switcher'
      - '@datetime.time'
      # Membership: a shipped member joins the design system its module
      # packages unless its definition says otherwise (design_system: ~).
      - '@daedalus_blueprint.active_design_system'
      # Optional: without Workspaces there is no active workspace to escape;
      # with it the sync executes outside any active workspace so shipped
      # defaults land live, never staged invisibly.
      - '@?workspaces.manager'
      # Optional: with daedalus_blueprint_library, a shipped blueprint: key
      # may name a module-shipped FILE blueprint, resolved through discovery.
      - '@?daedalus_blueprint_library.discovery'
  daedalus_stylish.variant_shipper:
    # The disk lane's other direction: site variants OUT to a module's
    # per-id file (MODULE.daedalus_stylish.variants.ID.yml), adopted in place so a
    # sync right after reports UNCHANGED.
    class: Drupal\daedalus_stylish\VariantShipper
    arguments:
      - '@module_handler'
      - '@entity_type.manager'
      # Owns the file names, the grammar check, and what modules ship.
      - '@daedalus_stylish.variant_importer'
      # Optional: with Workspaces the lookups and adopting saves run outside
      # any active workspace, like the importer's sync: shipped is LIVE.
      - '@?workspaces.manager'
  daedalus_stylish.skin_importer:
    class: Drupal\daedalus_stylish\SkinImporter
    arguments:
      - '@module_handler'
      - '@entity_type.manager'
      - '@daedalus_blueprint.deserializer'
      # Same admin-account and workspace-escape rationale as the variant
      # importer: shipped skins are code and land live.
      - '@daedalus_stylish.admin_account_switcher'
      - '@datetime.time'
      # Membership: a shipped member joins the design system its module
      # packages unless its definition says otherwise (design_system: ~).
      - '@daedalus_blueprint.active_design_system'
      - '@?workspaces.manager'
      # The defaults tier has no blueprint write (update_default is its
      # door), so the disk lane validates shipped defaults through the
      # defaults seam itself and stores them conditions-canonical.
      - '@daedalus_stylish.style_map_validator'
      - '@plugin.manager.daedalus_stylish_condition_type'
      # The fonts tier: landed through the font store (a face's bytes
      # become a permanent managed file) and validated through the font
      # seam; the gestures converge on the same two.
      - '@daedalus_stylish.font_validator'
      - '@daedalus_stylish.font_files'
      # The defaults validate against the default theme's guide, so the
      # kind waits while system.theme names a theme not installed yet (the
      # installer's window); the theme's landing syncs it.
      - '@theme_handler'
  daedalus_stylish.skin_shipper:
    # The skins lane's other direction: site skins OUT to a module's per-id
    # file (MODULE.daedalus_stylish.skins.ID.yml) with each font face's bytes
    # under assets/fonts/, adopted in place with the written {tokens,
    # animations, fonts, defaults} as the source hash so a sync right after
    # reports UNCHANGED. Skins carry no distro lock, so this is the one way a site's
    # edit of a shipped skin reaches disk.
    class: Drupal\daedalus_stylish\SkinShipper
    arguments:
      - '@module_handler'
      - '@entity_type.manager'
      # Owns the file names, the grammar check, the assets path, the
      # payload read of what was written, and what modules ship.
      - '@daedalus_stylish.skin_importer'
      # The fonts' managed files: their names become the basenames on disk.
      - '@daedalus_stylish.font_files'
      # Optional: with Workspaces the lookups and adopting saves run outside
      # any active workspace, like the importer's sync: shipped is LIVE.
      - '@?workspaces.manager'
  logger.channel.daedalus_stylish:
    parent: logger.channel_base
    arguments: ['daedalus_stylish']
  daedalus_stylish.shipped_sync:
    # The one activation lane for shipped definitions (disk to site is
    # "sync"; site to disk is "ship", daedalus_stylish.ship below): the two
    # importers in dependency order (skins, variants)
    # over a module set, behind hook_rebuild(), hook_modules_installed(), a
    # design system being activated (every enabled module re-syncs under
    # the incoming law, which lands the package the importers defer while
    # its system is inactive), the default theme landing (every enabled
    # module re-syncs, which lands the skins the importer defers while the
    # named default theme is not installed), and the daedalus_stylish:sync
    # command.
    class: Drupal\daedalus_stylish\ShippedSync
    arguments:
      - '@daedalus_stylish.skin_importer'
      - '@daedalus_stylish.variant_importer'
      # The rebuild guard: pending entity definition updates on the kinds'
      # own entity types (daedalus_skin, daedalus_variant) skip the sync;
      # other types' pending updates are not this lane's concern.
      - '@entity.definition_update_manager'
      - '@logger.channel.daedalus_stylish'
  Drupal\daedalus_stylish\ShippedSync: '@daedalus_stylish.shipped_sync'
  daedalus_stylish.ship:
    # The sync lane's other direction: a module's per-id files
    # (MODULE.daedalus_stylish.<kind>.ID.yml) rebuilt from the site's entities
    # and site materials adopted into new per-id files, one shipper per
    # kind in the sync's order (skins, variants). The materials lane of the package ship (tagged; the
    # daedalus-blueprint:design-system:ship command runs it after the
    # blueprint lane, at priority 0, so blueprint-owned variants are
    # already in their blueprints' files): the module rebuilt whole plus every
    # member of the system nothing ships yet. The hand-authored single
    # file is read for what the site edited and never written.
    class: Drupal\daedalus_stylish\Ship
    arguments:
      - '@module_handler'
      - '@daedalus_stylish.skin_shipper'
      - '@daedalus_stylish.variant_shipper'
    tags:
      - { name: daedalus_blueprint.package_shipper, priority: 0 }
  Drupal\daedalus_stylish\Ship: '@daedalus_stylish.ship'
  daedalus_stylish.media_value_resolver:
    class: Drupal\daedalus_stylish\MediaValueResolver
    arguments:
      - '@entity.repository'
      - '@entity_type.manager'
      - '@config.factory'
      - '@file_url_generator'
      # Constraint resolution mirrors validation: the key's captured address
      # (the validator's derivation) and its roster (the one derivation of
      # the effective constraint) decide the image_style constraint.
      - '@daedalus_stylish.style_map_validator'
      - '@theme_handler'
      - '@daedalus_stylish.vocabulary_roster'
  daedalus_stylish.variant_stylesheet:
    class: Drupal\daedalus_stylish\VariantStylesheet
    arguments:
      - '@daedalus_stylish.css_printer'
      # Width-condition detection for the demand-driven page-container rule.
      - '@plugin.manager.daedalus_stylish_condition_type'
      - '@state'
      - '@file_system'
      - '@stream_wrapper_manager'
      - '@library.discovery'
      # Reference resolution (loadVariant) and axis-declaration emission
      # order (orderedEntryVariants/scopeAxes) — delivery must resolve and
      # order exactly the way validation does.
      - '@daedalus_stylish.style_map_validator'
      # Media tokens in variant styles resolve pre-print, per print site.
      - '@daedalus_stylish.media_value_resolver'
      # Optional: without workspaces there is no preview edge and compiles
      # always see the (only) live revisions.
      - '@?workspaces.manager'
      # The materials roster: the compiled file's published set and its
      # order, and the cache metadata every inline render carries so a
      # draft becoming a material invalidates them.
      - '@daedalus_blueprint.materials_roster_builder'
  daedalus_stylish.variant_workspace_subscriber:
    # Publish fires no per-entity update hooks, so the save-chokepoint
    # reactions replay here: identity map and roster resets, stylesheet
    # recompile, usage-row resync.
    class: Drupal\daedalus_stylish\EventSubscriber\VariantWorkspaceSubscriber
    arguments:
      - '@daedalus_stylish.variant_stylesheet'
      - '@daedalus_stylish.variant_usage'
      - '@daedalus_stylish.variant_repository'
      - '@daedalus_blueprint.materials_roster_builder'
    tags:
      - { name: event_subscriber }
  daedalus_stylish.skin_stylesheet:
    class: Drupal\daedalus_stylish\SkinStylesheet
    arguments:
      - '@daedalus_stylish.css_printer'
      # The active skin: site defaults are its data; its tokens are read as
      # the roster's token records.
      - '@daedalus_stylish.skin_manager'
      - '@plugin.manager.daedalus_stylish_condition_type'
      - '@daedalus_blueprint.materials_roster_builder'
      # The declared tier: every refinement declaration's own defaults, per
      # theme; and the default theme the file compiles for.
      - '@daedalus_stylish.style_guide'
      - '@config.factory'
      - '@state'
      - '@file_system'
      - '@stream_wrapper_manager'
      - '@library.discovery'
      # Media tokens in site defaults resolve pre-print, per print site.
      - '@daedalus_stylish.media_value_resolver'
      # The skin's fonts: each face's file loaded by uuid, its URL printed
      # into the @font-face block the file opens with.
      - '@daedalus_stylish.font_files'
      - '@file_url_generator'
      # Optional: without workspaces there is no preview edge and compiles
      # always see the (only) live revision.
      - '@?workspaces.manager'
  daedalus_stylish.skin_workspace_subscriber:
    # Publish fires no per-entity update hooks: the roster reset, the
    # recompile of both files (a skin publish is a law change) and the
    # skin material usage resync replay here.
    class: Drupal\daedalus_stylish\EventSubscriber\SkinWorkspaceSubscriber
    arguments:
      - '@daedalus_stylish.skin_stylesheet'
      - '@daedalus_stylish.variant_stylesheet'
      - '@daedalus_blueprint.materials_roster_builder'
      - '@daedalus_stylish.skin_material_usage'
    tags:
      - { name: event_subscriber }
  daedalus_stylish.font_validator:
    # The family and faces grammar every font write path converges on (the
    # skin material gestures, the skins disk lane); a face's file resolves
    # through the entity repository (by uuid).
    class: Drupal\daedalus_stylish\FontValidator
    arguments:
      - '@entity.repository'
  daedalus_stylish.font_files:
    # The font store: daedalus_ui's file lane narrowed to woff2 and woff,
    # permanent files under public://daedalus_stylish/fonts, and the file
    # usage rows a skin holds its fonts' files through (every revision's
    # files stay held while the skin lives).
    class: Drupal\daedalus_stylish\FontFiles
    arguments:
      - '@daedalus_ui.file_lane'
      - '@file.mime_type.guesser'
      - '@entity.repository'
      - '@file.usage'
      # The skin's revisions, walked on delete for every file they named.
      - '@entity_type.manager'
  daedalus_stylish.defaults_settings_subscriber:
    class: Drupal\daedalus_stylish\EventSubscriber\DefaultsSettingsSubscriber
    # Breakpoint thresholds and the container_roots gate bake into both
    # compiled files, so every save of this config recompiles both; which
    # skin prints is the design-system switch's business, except the
    # site's skin CHOICE for the active system (skin_choice), which lives
    # in this config and swaps the active skin's tokens: the roster drops
    # and both skins' token ids and every variant ride the materials
    # delta, as on a switch. The default theme (system.theme) is a law
    # input and the switch subscriber's.
    arguments:
      - '@daedalus_stylish.skin_stylesheet'
      - '@daedalus_stylish.variant_stylesheet'
      - '@daedalus_blueprint.active_design_system'
      - '@daedalus_stylish.skin_manager'
      - '@daedalus_stylish.materials_provider'
      - '@daedalus_blueprint.materials_roster_builder'
      - '@daedalus_blueprint.materials_change_set'
      - '@entity_type.manager'
    tags:
      - { name: event_subscriber }
  daedalus_stylish.design_system_switch_subscriber:
    class: Drupal\daedalus_stylish\EventSubscriber\DesignSystemSwitchSubscriber
    # The one sweep a law change through config runs: drop the roster memo
    # and the style guide (the layered declarations with it, so the new law
    # is in force whatever order the subscribers on the event run in),
    # sync every module's shipped definitions under it, ride the touched
    # systems' token and member ids on the response's materials delta,
    # and recompile the two roster-fed files (defaults, variants). Three
    # saves run it: the pointer's and the landing of the system the pointer
    # already names (a switch; the active_design_system service reads the
    # pointer for it), and system.theme's default (the skins kind waits
    # while the named default theme is not installed; no systems touched).
    arguments:
      - '@daedalus_stylish.skin_stylesheet'
      - '@daedalus_stylish.variant_stylesheet'
      - '@daedalus_blueprint.materials_roster_builder'
      - '@daedalus_blueprint.materials_change_set'
      - '@daedalus_stylish.skin_manager'
      - '@daedalus_stylish.materials_provider'
      - '@entity_type.manager'
      - '@daedalus_stylish.style_guide'
      - '@daedalus_stylish.shipped_sync'
      - '@daedalus_blueprint.active_design_system'
    tags:
      - { name: event_subscriber }
  daedalus_stylish.style_backend.css:
    class: Drupal\daedalus_stylish\CssStyleBackend
    arguments:
      - '@daedalus_stylish.css_printer'
      - '@plugin.manager.daedalus_stylish_condition_type'
      - '@daedalus_stylish.variant_stylesheet'
      # Media tokens in the delivered map resolve pre-print, against the
      # host whose map it is.
      - '@daedalus_stylish.media_value_resolver'
      # The map prints in its canonical order, the host's document order
      # (NodeTreeBuilder::styleMapOf()), never the stored write order.
      - '@daedalus_blueprint.node_tree_builder'
      # Optional only for kernel tests that boot without daedalus_ui;
      # the module dependency makes it always present on a real site.
      # Branches variant delivery: edit mode resolves references inline at
      # their key roots, live mode keeps class + compiled stylesheet.
      - '@?daedalus_ui.mode_state'
  # The active style backend. Alternative backends (utility classes, etc.)
  # override this alias; the data model never changes.
  daedalus_stylish.style_backend:
    alias: daedalus_stylish.style_backend.css
  daedalus_stylish.width_band_migration:
    class: Drupal\daedalus_stylish\WidthBandMigration
    arguments:
      - '@plugin.manager.daedalus_stylish_condition_type'
      - '@entity_type.manager'
      - '@logger.factory'
  Drupal\daedalus_stylish\WidthBandMigration: '@daedalus_stylish.width_band_migration'

  # The width-band migration rides daedalus_layout's transform spine so the
  # presave/load-time safety net keeps stale tempstore sessions converging
  # after the "wide" condition retired. Registered permanently (the
  # ContainerGrammarSweep posture); priority below daedalus_stylish_layouts' sweeps
  # so a truly stale map speaks the container grammar before wide folds.
  # On sites without daedalus_layout the tag is never collected and the service
  # never instantiates.
  daedalus_stylish.width_band_sweep:
    class: Drupal\daedalus_stylish\WidthBandSweep
    arguments:
      - '@daedalus_stylish.width_band_migration'
    tags:
      - { name: daedalus_layout.host_transform, priority: -20 }

  daedalus_stylish.relative_selector_convergence:
    class: Drupal\daedalus_stylish\RelativeSelectorConvergence
    arguments:
      - '@entity_type.manager'
      - '@logger.factory'
  Drupal\daedalus_stylish\RelativeSelectorConvergence: '@daedalus_stylish.relative_selector_convergence'

  # The relative selector grammar's convergence: every "::" suffix in its
  # one canonical spelling (the retired "::>" children spelling rewritten
  # to "::> *"). Registered permanently and LAST among the sweeps, so the
  # container hoist's children entry converges in the same pass.
  daedalus_stylish.relative_selector_sweep:
    class: Drupal\daedalus_stylish\RelativeSelectorSweep
    arguments:
      - '@daedalus_stylish.relative_selector_convergence'
    tags:
      - { name: daedalus_layout.host_transform, priority: -25 }

  daedalus_stylish.fact_condition_convergence:
    class: Drupal\daedalus_stylish\FactConditionConvergence
    arguments:
      - '@plugin.manager.daedalus_stylish_condition_type'
      - '@entity_type.manager'
      - '@logger.factory'
  Drupal\daedalus_stylish\FactConditionConvergence: '@daedalus_stylish.fact_condition_convergence'

  # The fact-condition convergence: position is a qualifier, not a
  # condition, so every retired fact condition ("first-child",
  # "not-last-child", "odd", …) moves onto its qualified key. Registered
  # permanently and after the relative selector sweep, so every key is
  # canonical before it is qualified.
  daedalus_stylish.fact_condition_sweep:
    class: Drupal\daedalus_stylish\FactConditionSweep
    arguments:
      - '@daedalus_stylish.fact_condition_convergence'
    tags:
      - { name: daedalus_layout.host_transform, priority: -30 }

  daedalus_stylish.form_alter.bundle_edit:
    class: Drupal\daedalus_stylish\Form\BundleEditFormAlter
    arguments: ['@daedalus_stylish.field_manager', '@entity_type.manager', '@daedalus_ui.form_alter.bundle_edit']
  # The same box mirrored on daedalus_ui's bundle roster (the tab's
  # read-only second door) as the Styling column.
  daedalus_stylish.bundle_roster.styling:
    class: Drupal\daedalus_stylish\EventSubscriber\StylingColumn
    arguments: ['@daedalus_stylish.field_manager']
    tags:
      - { name: event_subscriber }
  # The design system form's default_skin: daedalus_blueprint keeps the
  # free-text machine name (it knows no skins); this narrows it to a
  # select of the system's member skins.
  daedalus_stylish.form_alter.design_system:
    class: Drupal\daedalus_stylish\Form\DesignSystemFormAlter
    arguments: ['@daedalus_stylish.skin_manager']
  # Daedalus Stylish's materials provider: the active skin's tokens and
  # animations, the published variants and fonts as roster records (the
  # ONE place these four kinds are read into the materials spine;
  # spellings derive from the declarations here and nowhere else).
  daedalus_stylish.materials_provider:
    class: Drupal\daedalus_stylish\Materials\DaedalusStylishMaterialsProvider
    arguments:
      - '@daedalus_stylish.style_guide'
      - '@daedalus_stylish.skin_manager'
      # Theme resolution: the declaration spine's one answer (siteTheme()).
      - '@daedalus_ui.page_builder_declarations'
      - '@daedalus_stylish.variant_repository'
      # The gesture lane (save_material / update_material / remove_material
      # with kind variant): the manager and the capture walk, as closures
      # because the dependency is circular by construction (the managers
      # validate through StyleMapValidator, whose universe is the roster
      # this provider feeds).
      - !service_closure '@daedalus_stylish.variant_manager'
      - !service_closure '@daedalus_stylish.variant_capture'
      - '@current_user'
      - '@config.factory'
      # A closure: the element read walks the lean tree through the field
      # handlers, whose validator reads the roster this provider feeds.
      - !service_closure '@daedalus_blueprint.element_materials'
      - '@daedalus_blueprint.value_grammar'
      # The roster is what this provider feeds: a closure, never a direct
      # dependency (the collector would recurse).
      - !service_closure '@daedalus_blueprint.materials_roster_builder'
      # The verdict the variant records are filtered by.
      - '@daedalus_stylish.variant_conformance'
      # The distro lock: a shipped variant record is `updatable` only once
      # the developer gate (settings.php) lifts it.
      - '@daedalus_blueprint.distro_lock'
      # The skin material gestures (kind token, animation, font): a closure
      # like the other managers,
      # its validator's universe being the roster this provider feeds.
      - !service_closure '@daedalus_stylish.skin_material_manager'
      # The AI context budget, the guard an offered mint and an update
      # turning offered on answer: a closure, since its weight sources
      # render the roster this provider feeds.
      - !service_closure '@daedalus_blueprint.materials_budget'
    tags:
      - { name: daedalus_blueprint.materials_provider }
  # The token gestures: mint, update and delete one token of the active
  # skin, in the layer the site may write (the site layer on a consuming
  # site, the package layer on the site's own skin or under the developer
  # gate). The materials provider dispatches save_material /
  # update_material / remove_material with kind token here.
  daedalus_stylish.skin_material_manager:
    class: Drupal\daedalus_stylish\SkinMaterialManager
    arguments:
      # The token and animation seams every write validates the merged
      # layers through (the font seam is its own service below).
      - '@daedalus_stylish.style_map_validator'
      # The active skin, the one every skin material gesture addresses, and the
      # layer rule (SkinManager::writesSiteLayer()) every skin write shares.
      - '@daedalus_stylish.skin_manager'
      - '@current_user'
      # Compound condition keys canonicalize (part order) on write.
      - '@plugin.manager.daedalus_stylish_condition_type'
      # The scale declarations a token's custom property derives under
      # (StyleGuide::tokenVariable()), the usage lane's reference form.
      - '@daedalus_stylish.style_guide'
      # The usage table: the count behind a card and the rewrite batches'
      # work lists, one table for both sections.
      - '@daedalus_stylish.skin_material_usage'
      # The disk lane: the revert gesture and the shipped state read "what
      # does the provider ship for this material right now" through the
      # importer (a font's faces landed again from the module's assets).
      - '@daedalus_stylish.skin_importer'
      # The font seam every font write validates the merged layers through,
      # and the font store the shipped-state comparison content-addresses
      # a worn font's faces with.
      - '@daedalus_stylish.font_validator'
      - '@daedalus_stylish.font_files'
  daedalus_stylish.skin_material_usage:
    # The daedalus_skin_material_usage table: which source entities reference
    # which skin materials (a token's var(--{prefix}-{name}), an
    # animation's motion-{name} keyframes ident, a font's quoted family in
    # a font-family stack) inside their saved default-revision CSS values,
    # mirrored at the entity save chokepoint across the three stores; the
    # variant table's twin for the materials that live on the skin, one
    # table for all three sections.
    class: Drupal\daedalus_stylish\SkinMaterialUsage
    arguments:
      - '@database'
      - '@entity_type.manager'
      - '@entity_field.manager'
      - '@daedalus_blueprint.host_resolver'
      # The font-family binding: which token scale is a family source.
      - '@daedalus_stylish.style_guide'
  Drupal\daedalus_stylish\SkinMaterialManager: '@daedalus_stylish.skin_material_manager'
  Drupal\daedalus_stylish\Materials\DaedalusStylishMaterialsProvider: '@daedalus_stylish.materials_provider'
  # The offered variants the site's CURRENT law refuses, judged once per
  # law change (cache-backed under the provider's tags) and withheld from
  # the roster by the provider; the request memo resets with the roster's
  # (MaterialsRosterBuilder::reset() cascades to the provider's reset()).
  daedalus_stylish.variant_conformance:
    class: Drupal\daedalus_stylish\VariantConformance
    arguments:
      # Closures both ways: the provider withholds this verdict, and the
      # validator's universe is the roster the provider feeds.
      - !service_closure '@daedalus_stylish.materials_provider'
      - !service_closure '@daedalus_stylish.style_map_validator'
      - '@daedalus_stylish.variant_repository'
      - '@daedalus_blueprint.active_design_system'
      - '@daedalus_stylish.style_guide'
      - '@daedalus_ui.page_builder_declarations'
      - '@cache.default'
      - '@?workspaces.manager'
  Drupal\daedalus_stylish\VariantConformance: '@daedalus_stylish.variant_conformance'
  # Whether one skin mints every name the guide's token contract
  # promises (site.token_contract), and what it lacks per scale: the
  # skin's half of the contract, the guide build proving the other
  # (every curated stop is a contract name).
  daedalus_stylish.skin_conformance:
    class: Drupal\daedalus_stylish\SkinConformance
    arguments:
      - '@daedalus_stylish.style_guide'
  Drupal\daedalus_stylish\SkinConformance: '@daedalus_stylish.skin_conformance'
  # The server capture of an element's look for save_material /
  # update_material with kind variant (the AI's door; the client's
  # variant-scope.js captureEntries()/saveStyles() is its twin for live
  # preview): the element's own overrides, its parts, its staged children by
  # slot path, the same-axis look it wears folded beneath.
  daedalus_stylish.variant_capture:
    class: Drupal\daedalus_stylish\VariantCapture
    arguments:
      - '@daedalus_stylish.style_map_validator'
      - '@daedalus_stylish.subtree_slot_keys'
  # Contributes daedalus_stylish's declarations (axis order per scope, conditions,
  # parts, instance namespaces, closed-world stylable rosters) to
  # daedalus_blueprint's dialect catalog; the materials themselves ride the
  # roster through daedalus_stylish.materials_provider.
  daedalus_stylish.dialect_vocabulary_subscriber:
    class: Drupal\daedalus_stylish\EventSubscriber\DialectVocabularySubscriber
    arguments:
      - '@plugin.manager.daedalus_stylish_condition_type'
      - '@daedalus_stylish.style_guide'
      # The stylable rosters the catalog carries are the vocabulary
      # roster's, one per kind.
      - '@daedalus_stylish.vocabulary_roster'
      - '@daedalus_ui.page_builder_declarations'
      # The dressed tags are the active skin's base default scopes.
      - '@daedalus_stylish.skin_manager'
      # The rosters' value spaces (the bindings and the deviations) ride
      # the same contribution, from the derivation the JSON door prints.
      - '@daedalus_stylish.vocabulary_value_spaces'
    tags:
      - { name: event_subscriber }
  daedalus_stylish.component_styles_subscriber:
    class: Drupal\daedalus_stylish\EventSubscriber\ElementStylesSubscriber
    arguments:
      - '@daedalus_stylish.style_guide'
      - '@daedalus_stylish.style_map_validator'
      - '@theme_handler'
      - '@daedalus_blueprint.element_locator'
      # The depth stamp a move's strip reads (MaterialRecord::rootOnly()).
      - '@daedalus_blueprint.materials_roster_builder'
    tags:
      - { name: event_subscriber }
