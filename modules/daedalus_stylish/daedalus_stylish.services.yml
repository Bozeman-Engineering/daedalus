      - '@daedalus_stylish.style_guide'
      - '@config.factory'
      - '@state'
      - '@file_system'
      - '@stream_wrapper_manager'
      - '@library.discovery'
      # Media tokens in site defaults resolve pre-print, per print site.
      - '@daedalus_stylish.media_value_resolver'
      # Optional: without workspaces there is no preview edge and compiles
      # always see the (only) live revision.
      - '@?workspaces.manager'
  daedalus_stylish.skin_workspace_subscriber:
