# The daedalus_skin schema's entity-level guidance (the schema fragment the
# AI sees on eb_read_schema daedalus_skin). Field grammar detail rides the
# field handlers' own schemas; this routes the workflow.
guidance: 'A skin is a member of a design system (its design_system field names the system; none means global) and carries that system''s look as data: the tokens field holds design-token values ({scale: {name: value}}) for the scales the site declares in code, and the defaults field holds live site-wide element defaults ({scope: element-relative styles}). The active skin is the active design system''s default_skin; editing it restyles the site. BLOCKING: invoke the skins skill before creating or editing a skin; it carries the live catalog (which skin is active, entity ids, membership) and the read-merge-write recipes. machine_name is identity: set at create time only. Activation is a design-system act (an administrator sets the system''s default_skin); you cannot switch the active skin.'
