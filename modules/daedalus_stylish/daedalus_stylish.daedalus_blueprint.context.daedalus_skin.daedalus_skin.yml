# The daedalus_skin schema's entity-level guidance (the schema fragment the
# AI sees on eb_read_schema daedalus_skin). Field grammar detail rides the
# field handlers' own schemas; this routes the workflow.
guidance: 'A skin is a member of a design system (its design_system field names the system; none means global) and carries that system''s look as data: the tokens field holds one record per design token ({scale: {name: {value, description, offered}}}) for the scales the site declares in code, and the defaults field holds live site-wide element defaults ({scope: element-relative styles}). A shipped skin is two layers, the package''s and the site''s over it; the fields here are the package layer, and the brief and the materials schema show the skin as worn. The site wears one skin: its choice for the active design system while that names a published, conforming member, else the system''s default_skin. BLOCKING: invoke the skins skill before creating or editing a skin; it carries the live catalog (which skin is worn, entity ids, membership) and the operations that write one: tokens through save_material, update_material and remove_material with kind token, defaults through update_default, never a whole-field write. machine_name is identity: set at create time only. Wearing a skin is an administer gesture (the skin card, or drush); no operation switches it.'
