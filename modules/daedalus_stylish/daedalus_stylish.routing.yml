# The styling settings form: the four site-mechanics keys of
# daedalus_stylish.settings (ai_minting, container_roots, media_image_style,
# breakpoints) under the Daedalus config category's Styling sub-category.
# skin_choice and opt_outs are never on it: the skin card and drush own the
# one, the bundle form's Page builder tab the other.
daedalus_stylish.settings:
  path: '/admin/config/daedalus/styling/settings'
  defaults:
    _title: 'Styling'
    _form: 'Drupal\daedalus_stylish\Form\SettingsForm'
  requirements:
    _permission: 'administer site configuration'

daedalus_stylish.inspector_popout:
  path: '/daedalus_stylish/inspector-popout'
  methods: [GET]
  defaults:
    _controller: 'Drupal\daedalus_stylish\Controller\InspectorPopout::build'
    _title: 'Styles'
  requirements:
    _permission: 'use daedalus ui edit mode'
  options:
    _daedalus_ui.popout: true

# The variant lifecycle routes: the gestures with no page batch to
# ride (the palette manages the vocabulary from wherever it is open) and
# the two that drive a core Batch (delete). The WRITES that mint or push a
# variant are page-language ops (save_material / update_material, kind
# variant, daedalus_blueprint's material gesture family), submitted by the
# inspector and the AI alike; the routes that remain are ADAPTERS over the
# same DaedalusStylishMaterialsProvider methods and answer the same materials
# delta. Usage is readable by every gesture that needs its loud count: the
# push prompt AND the delete dialog ("Detach N pieces of content, then
# delete").
daedalus_stylish.variant_usage:
  path: '/daedalus_stylish/variants/{reference}/usage'
  methods: [GET]
  defaults:
    _controller: 'Drupal\daedalus_stylish\Controller\VariantApiController::usage'
    _title: 'Style variant usage'
  options:
    no_cache: 'TRUE'
  requirements:
    _permission: 'update variants+delete variants+delete variants in use+administer variants'

# Copy-as-my-variant: the distro lock's fork gesture. A CREATE, not an
# update — the source is read, never touched — so it rides the create
# permission like save-as.
daedalus_stylish.variant_copy:
  path: '/daedalus_stylish/variants/{reference}/copy'
  methods: [POST]
  defaults:
    _controller: 'Drupal\daedalus_stylish\Controller\VariantApiController::copy'
    _title: 'Copy a style variant as a site variant'
  options:
    no_cache: 'TRUE'
  requirements:
    _permission: 'create variants+administer variants'
    _csrf_request_header_token: 'TRUE'

# Delete: two grades share the route. The route admits either grade;
# the contextual gate — a WORN variant needs "delete variants in use",
# because deleting it runs the detach-then-delete batch — lives in
# VariantManager::deleteVariant(), where the usage table is readable.
daedalus_stylish.variant_delete:
  path: '/daedalus_stylish/variants/{reference}'
  methods: [DELETE]
  defaults:
    _controller: 'Drupal\daedalus_stylish\Controller\VariantApiController::delete'
    _title: 'Delete a style variant'
  options:
    no_cache: 'TRUE'
  requirements:
    _permission: 'delete variants+delete variants in use+administer variants'
    _csrf_request_header_token: 'TRUE'

# Details: the face gesture, label and/or description in one revisioned
# save (machine name and uuid are identity and never change, so every
# style map reference survives a relabel).
daedalus_stylish.variant_details:
  path: '/daedalus_stylish/variants/{reference}/details'
  methods: [POST]
  defaults:
    _controller: 'Drupal\daedalus_stylish\Controller\VariantApiController::details'
    _title: 'Update the details of a style variant'
  options:
    no_cache: 'TRUE'
  requirements:
    _permission: 'update variants+administer variants'
    _csrf_request_header_token: 'TRUE'

# The revision history behind the lifecycle card's restore gesture.
daedalus_stylish.variant_revisions:
  path: '/daedalus_stylish/variants/{reference}/revisions'
  methods: [GET]
  defaults:
    _controller: 'Drupal\daedalus_stylish\Controller\VariantApiController::revisions'
    _title: 'Style variant revisions'
  options:
    no_cache: 'TRUE'
  requirements:
    _permission: 'update variants+administer variants'

# Restore: an update gesture like push — a NEW default revision carrying an
# old revision's revisionable fields, so a restore is itself one restore
# away from undo.
daedalus_stylish.variant_restore:
  path: '/daedalus_stylish/variants/{reference}/revisions/{revision_id}/restore'
  methods: [POST]
  defaults:
    _controller: 'Drupal\daedalus_stylish\Controller\VariantApiController::restore'
    _title: 'Restore a style variant revision'
  options:
    no_cache: 'TRUE'
  requirements:
    _permission: 'update variants+administer variants'
    _csrf_request_header_token: 'TRUE'
    revision_id: '\d+'

# Revert-to-shipped-defaults: an update gesture like push, an
# ordinary revisioned save whose styles come from the provider's disk file.
daedalus_stylish.variant_revert:
  path: '/daedalus_stylish/variants/{reference}/revert'
  methods: [POST]
  defaults:
    _controller: 'Drupal\daedalus_stylish\Controller\VariantApiController::revert'
    _title: 'Revert a style variant to its shipped defaults'
  options:
    no_cache: 'TRUE'
  requirements:
    _permission: 'update variants+administer variants'
    _csrf_request_header_token: 'TRUE'

# The skin material lifecycle routes: the variant route template for the
# materials that live on the skin, its TOKENS, its ANIMATIONS and its
# FONTS, one controller over the three sections (SkinMaterialApiController;
# the section rides each route's defaults). Minting and the value, steps,
# faces, description and offered editors are the save_material /
# update_material ops (kind token, animation, font); the routes that
# remain adapt onto the skin material manager, plus the two the fonts
# section needs beside the ops: the bytes door (a face's file upload,
# which no op can carry) and the delivered @font-face read (a face's url()
# is the server's to print). A token id is "{scale}/{name}" (the roster's),
# spelled as two path parameters: the route provider matches by pattern
# outline (one % per parameter), so a single {reference} holding the
# slash would only ever match as a path's LAST segment and the /usage,
# /rename and /revert routes would be 404. An animation id is its name.
# The live reference count behind a card's loud prompts, beside the
# card's management facts (layer, provider, shipped state).
daedalus_stylish.skin_token_usage:
  path: '/daedalus_stylish/skin/tokens/{scale}/{name}/usage'
  methods: [GET]
  defaults:
    _controller: 'Drupal\daedalus_stylish\Controller\SkinMaterialApiController::usage'
    _title: 'Token usage'
    section: 'tokens'
  options:
    no_cache: 'TRUE'
  requirements:
    _permission: 'update skin materials+delete skin materials+delete skin materials in use+administer skins'

daedalus_stylish.skin_animation_usage:
  path: '/daedalus_stylish/skin/animations/{name}/usage'
  methods: [GET]
  defaults:
    _controller: 'Drupal\daedalus_stylish\Controller\SkinMaterialApiController::usage'
    _title: 'Animation usage'
    section: 'animations'
  options:
    no_cache: 'TRUE'
  requirements:
    _permission: 'update skin materials+delete skin materials+delete skin materials in use+administer skins'

# The font file door: the skin tab uploads each face's file here (the
# font store over the daedalus_ui file lane, woff2 and woff, temporary
# until a font record names the file) and mints with the uuids the
# responses name (save_material, kind font).
# Static paths before the {name} routes: the router matches a literal
# segment first, so "files" and "stylesheet" never read as a font name.
daedalus_stylish.skin_font_upload:
  path: '/daedalus_stylish/skin/fonts/files'
  methods: [POST]
  defaults:
    _controller: 'Drupal\daedalus_stylish\Controller\SkinMaterialApiController::upload'
    _title: 'Upload a font file'
  options:
    no_cache: 'TRUE'
  requirements:
    _permission: 'create skin materials+update skin materials+administer skins'
    _csrf_request_header_token: 'TRUE'

# The delivered @font-face text: the canvas's landing after a font write
# (the compiled skin file the page loaded predates any font minted this
# session). Every skin material grade, since the read exists for the
# writes' landing.
daedalus_stylish.skin_font_stylesheet:
  path: '/daedalus_stylish/skin/fonts/stylesheet'
  methods: [GET]
  defaults:
    _controller: 'Drupal\daedalus_stylish\Controller\SkinMaterialApiController::fontStylesheet'
    _title: 'The delivered font faces'
  options:
    no_cache: 'TRUE'
  requirements:
    _permission: 'create skin materials+update skin materials+delete skin materials+delete skin materials in use+administer skins'

daedalus_stylish.skin_font_usage:
  path: '/daedalus_stylish/skin/fonts/{name}/usage'
  methods: [GET]
  defaults:
    _controller: 'Drupal\daedalus_stylish\Controller\SkinMaterialApiController::usage'
    _title: 'Font usage'
    section: 'fonts'
  options:
    no_cache: 'TRUE'
  requirements:
    _permission: 'update skin materials+delete skin materials+delete skin materials in use+administer skins'

# Rename: the name IS the reference's tail (a token's custom property, an
# animation's keyframes name), so a referenced material's rename stages
# the rewrite-then-rename batch (every reference respelled, then the
# record moves); a package material refuses on a consuming site.
daedalus_stylish.skin_token_rename:
  path: '/daedalus_stylish/skin/tokens/{scale}/{name}/rename'
  methods: [POST]
  defaults:
    _controller: 'Drupal\daedalus_stylish\Controller\SkinMaterialApiController::rename'
    _title: 'Rename a token'
    section: 'tokens'
  options:
    no_cache: 'TRUE'
  requirements:
    _permission: 'update skin materials+administer skins'
    _csrf_request_header_token: 'TRUE'

daedalus_stylish.skin_animation_rename:
  path: '/daedalus_stylish/skin/animations/{name}/rename'
  methods: [POST]
  defaults:
    _controller: 'Drupal\daedalus_stylish\Controller\SkinMaterialApiController::rename'
    _title: 'Rename an animation'
    section: 'animations'
  options:
    no_cache: 'TRUE'
  requirements:
    _permission: 'update skin materials+administer skins'
    _csrf_request_header_token: 'TRUE'

# A font's name is its roster id alone (a stack names the family), so its
# rename is always immediate.
daedalus_stylish.skin_font_rename:
  path: '/daedalus_stylish/skin/fonts/{name}/rename'
  methods: [POST]
  defaults:
    _controller: 'Drupal\daedalus_stylish\Controller\SkinMaterialApiController::rename'
    _title: 'Rename a font'
    section: 'fonts'
  options:
    no_cache: 'TRUE'
  requirements:
    _permission: 'update skin materials+administer skins'
    _csrf_request_header_token: 'TRUE'

# Revert-to-shipped: an ordinary revisioned save converging the material
# toward the provider's disk file (the site's record over it dropped).
daedalus_stylish.skin_token_revert:
  path: '/daedalus_stylish/skin/tokens/{scale}/{name}/revert'
  methods: [POST]
  defaults:
    _controller: 'Drupal\daedalus_stylish\Controller\SkinMaterialApiController::revert'
    _title: 'Revert a token to its shipped record'
    section: 'tokens'
  options:
    no_cache: 'TRUE'
  requirements:
    _permission: 'update skin materials+administer skins'
    _csrf_request_header_token: 'TRUE'

daedalus_stylish.skin_animation_revert:
  path: '/daedalus_stylish/skin/animations/{name}/revert'
  methods: [POST]
  defaults:
    _controller: 'Drupal\daedalus_stylish\Controller\SkinMaterialApiController::revert'
    _title: 'Revert an animation to its shipped record'
    section: 'animations'
  options:
    no_cache: 'TRUE'
  requirements:
    _permission: 'update skin materials+administer skins'
    _csrf_request_header_token: 'TRUE'

daedalus_stylish.skin_font_revert:
  path: '/daedalus_stylish/skin/fonts/{name}/revert'
  methods: [POST]
  defaults:
    _controller: 'Drupal\daedalus_stylish\Controller\SkinMaterialApiController::revert'
    _title: 'Revert a font to its shipped record'
    section: 'fonts'
  options:
    no_cache: 'TRUE'
  requirements:
    _permission: 'update skin materials+administer skins'
    _csrf_request_header_token: 'TRUE'

# Delete: two grades share the route like variants. The route admits either
# grade; the contextual gate lives in the skin material manager: a
# REFERENCED material whose removal would delete it needs "delete skin
# materials in use", because deleting it runs the rewrite batch (a var()
# to the literal, a keyframes name to none) over the usage table's work
# list. A site override dropped (the package's record revealed) touches
# no reference and needs no grade beyond delete.
daedalus_stylish.skin_token_delete:
  path: '/daedalus_stylish/skin/tokens/{scale}/{name}'
  methods: [DELETE]
  defaults:
    _controller: 'Drupal\daedalus_stylish\Controller\SkinMaterialApiController::delete'
    _title: 'Delete a token'
    section: 'tokens'
  options:
    no_cache: 'TRUE'
  requirements:
    _permission: 'delete skin materials+delete skin materials in use+administer skins'
    _csrf_request_header_token: 'TRUE'

daedalus_stylish.skin_animation_delete:
  path: '/daedalus_stylish/skin/animations/{name}'
  methods: [DELETE]
  defaults:
    _controller: 'Drupal\daedalus_stylish\Controller\SkinMaterialApiController::delete'
    _title: 'Delete an animation'
    section: 'animations'
  options:
    no_cache: 'TRUE'
  requirements:
    _permission: 'delete skin materials+delete skin materials in use+administer skins'
    _csrf_request_header_token: 'TRUE'

daedalus_stylish.skin_font_delete:
  path: '/daedalus_stylish/skin/fonts/{name}'
  methods: [DELETE]
  defaults:
    _controller: 'Drupal\daedalus_stylish\Controller\SkinMaterialApiController::delete'
    _title: 'Delete a font'
    section: 'fonts'
  options:
    no_cache: 'TRUE'
  requirements:
    _permission: 'delete skin materials+delete skin materials in use+administer skins'
    _csrf_request_header_token: 'TRUE'

# The skin lifecycle routes: the skin card's gestures with no page batch
# to ride, adapters over SkinManager (which owns the gestures) answering
# the materials delta. The administer grade alone on every write:
# choosing, copying, restoring and reverting restyle the whole site,
# the same act as activating a design system. The card's READ admits
# every grade that touches the skin, so whoever edits its tokens or
# defaults sees which skin they edit.
daedalus_stylish.skins:
  path: '/daedalus_stylish/skins'
  methods: [GET]
  defaults:
    _controller: 'Drupal\daedalus_stylish\Controller\SkinApiController::skins'
    _title: 'The skins the active design system may wear'
  options:
    no_cache: 'TRUE'
  requirements:
    _permission: 'create skin materials+update skin materials+delete skin materials+delete skin materials in use+edit skin defaults+administer skins'

# Choose: which member skin the active design system wears on this site,
# a site setting beside the activation (daedalus_stylish.settings
# skin_choice), never a write to the unit the package ships.
daedalus_stylish.skin_choose:
  path: '/daedalus_stylish/skins/{reference}/choose'
  methods: [POST]
  defaults:
    _controller: 'Drupal\daedalus_stylish\Controller\SkinApiController::choose'
    _title: 'Choose the skin the site wears'
  options:
    no_cache: 'TRUE'
  requirements:
    _permission: 'administer skins'
    _csrf_request_header_token: 'TRUE'

# Copy-as-my-skin: the distro lock's fork gesture for the look. A CREATE,
# not an update: the source is read, never touched; the copy has no
# provider, so the site owns every gesture on it.
daedalus_stylish.skin_copy:
  path: '/daedalus_stylish/skins/{reference}/copy'
  methods: [POST]
  defaults:
    _controller: 'Drupal\daedalus_stylish\Controller\SkinApiController::copy'
    _title: 'Copy a skin as a site skin'
  options:
    no_cache: 'TRUE'
  requirements:
    _permission: 'administer skins'
    _csrf_request_header_token: 'TRUE'

# The revision history behind the skin card's restore gesture.
daedalus_stylish.skin_revisions:
  path: '/daedalus_stylish/skins/{reference}/revisions'
  methods: [GET]
  defaults:
    _controller: 'Drupal\daedalus_stylish\Controller\SkinApiController::revisions'
    _title: 'Skin revisions'
  options:
    no_cache: 'TRUE'
  requirements:
    _permission: 'administer skins'

# Restore: an update gesture, a NEW default revision carrying an old
# revision's content (the site layer alone on a consuming site, where the
# package layer is the disk's), so a restore is itself one restore away
# from undo.
daedalus_stylish.skin_restore:
  path: '/daedalus_stylish/skins/{reference}/revisions/{revision_id}/restore'
  methods: [POST]
  defaults:
    _controller: 'Drupal\daedalus_stylish\Controller\SkinApiController::restore'
    _title: 'Restore a skin revision'
  options:
    no_cache: 'TRUE'
  requirements:
    _permission: 'administer skins'
    _csrf_request_header_token: 'TRUE'
    revision_id: '\d+'

# Revert the site layer: an ordinary revisioned save emptying the site's
# tokens and defaults over the package's, so the skin wears what its
# module ships, whole.
daedalus_stylish.skin_revert:
  path: '/daedalus_stylish/skins/{reference}/revert'
  methods: [POST]
  defaults:
    _controller: 'Drupal\daedalus_stylish\Controller\SkinApiController::revert'
    _title: 'Revert a skin to what its module ships'
  options:
    no_cache: 'TRUE'
  requirements:
    _permission: 'administer skins'
    _csrf_request_header_token: 'TRUE'

# The skin's delivery read: the active published skin's defaults as the
# inspector's guide payload carries them (ClientStyleGuide skinDefaults)
# beside the skin stylesheet's current CSS text. The skin session's
# landing (push-bar.js commitSession, leader-source.js refreshDefaults):
# after a push of update_default ops the panel re-reads the skin's
# document and the canvas stamps the recompiled CSS, so the pushed look
# lands without a reload. The same grade as the op, since the read
# exists for its landing.
daedalus_stylish.defaults:
  path: '/daedalus_stylish/defaults'
  methods: [GET]
  defaults:
    _controller: 'Drupal\daedalus_stylish\Controller\SkinApiController::defaults'
    _title: 'The active skin defaults'
  options:
    no_cache: 'TRUE'
  requirements:
    _permission: 'edit skin defaults+administer skins'
