# A template's style map: a Layout Builder enabled entity view display hosts
# its default layout as a page document, and the document's styles live here
# (the display host's store; a content host's is its style map field). The
# map is stored as a list of {key, entry} rows in map order (config refuses
# a dot in any key, and a part or rule key carries one), each entry in the
# style map grammar, whose one validation seam is the style map field
# handler (StyleMapValidator), so the entry itself is opaque to typed config.
# The config hosts (DisplayHost, FrameHost through ConfigStyleMapTrait) are
# the one reader and writer of the shape.
core.entity_view_display.*.*.*.third_party.daedalus_stylish:
  type: mapping
  label: 'Daedalus Stylish display settings'
  mapping:
    styles:
      type: daedalus_stylish.style_map
      label: 'Style map'

# The site frame's style map: the same store on the frame host's config
# entity (daedalus_blueprint.frame.*).
daedalus_blueprint.frame.*.third_party.daedalus_stylish:
  type: mapping
  label: 'Daedalus Stylish frame settings'
  mapping:
    styles:
      type: daedalus_stylish.style_map
      label: 'Style map'

daedalus_stylish.style_map:
  type: sequence
  label: 'Style map: rows of a selectable key and its style entry'
  sequence:
    type: mapping
    label: 'Style map row'
    mapping:
      key:
        type: string
        label: 'Selectable key'
      entry:
        type: daedalus_stylish.style_entry
        label: 'Style entry'

daedalus_stylish.style_entry:
  type: ignore
  label: 'A style entry: condition keys to property values and an optional variants list, in the style map grammar the style map field handler validates'
