daedalus_stylish.settings:
  type: config_object
  label: 'Daedalus Stylish settings'
  mapping:
    ai_minting:
      type: boolean
      label: 'Whether AI may mint new tokens, palette swatches and animations through the material gestures and the blueprint create lane. Its own governance axis, never derived from how the active design system enforces its law: humans stay governed by the "create tokens" / "create swatches" / "create animations" permissions, disk-shipped materials by the importers. Only an explicit false closes the gate (fail-open for sites predating the key).'
    container_roots:
      type: boolean
      label: 'Emit the page-level width-band query container rule (container-type: inline-size on the page canvas) wherever container breakpoint conditions are styled (turn off when the theme manages its own query container)'
    media_image_style:
      type: string
      label: 'Image style media referenced from style values resolves through when no style guide constraint names one; empty serves the original file'
    opt_outs:
      type: sequence
      label: 'Bundles ("entity_type_id.bundle") that deliberately opted out of styling; auto-enablement never re-defaults these'
      sequence:
        type: string
        label: 'Bundle key'
    skin_choice:
      type: sequence
      label: 'The skin the site wears per design system, keyed by design system id: the site''s choice among the system''s published, conforming member skins. A system absent here wears its default_skin (the package''s answer); a choice the system may no longer wear (unpublished, moved, nonconforming) falls back to it too'
      sequence:
        type: string
        label: 'Skin machine name'
    breakpoints:
      type: mapping
      label: 'Condition breakpoint thresholds, in px'
      mapping:
        narrow:
          type: integer
          label: 'Container width at or below which "narrow" styles apply'
        medium:
          type: integer
          label: 'Container width at or below which "medium" styles apply; the band starts at narrow + 1, so the bands tile exactly'

