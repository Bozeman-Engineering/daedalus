# The variant wearing this module's other shipped materials. On a strict
# site each reference must name a published material, so this variant
# lands only after the skin (two of its tokens and its sync_test_fade
# animation) did: the orchestrator's order, and the proof of it.
sync_test_section:
  label: 'Sync test section'
  scope: 'kind:container'
  styles:
    '':
      default:
        padding: 'var(--space-gutter)'
        background-color: 'var(--color-accent)'
        animation-name: 'motion-sync_test_fade'
