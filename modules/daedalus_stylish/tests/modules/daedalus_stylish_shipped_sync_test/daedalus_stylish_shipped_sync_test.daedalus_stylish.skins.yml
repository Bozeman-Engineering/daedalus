# The skin minting the token the shipped variant references as
# var(--space-gutter), and a font token (the suite binds font-family to
# the font scale) whose stack names this module's shipped font by its
# family; the test activates a design system whose default_skin names the
# skin before anything syncs (a recipe's config lands before its content).
sync_test_skin:
  label: 'Sync test skin'
  tokens:
    space:
      gutter: '2rem'
    font:
      body: '"Sync Test Sans", sans-serif'
