# The package's skin: aurora's default_skin, minting the two tokens the
# shipped variant references, var(--space-gutter) and var(--color-accent),
# and the animation it wears as motion-aurora_fade.
# No design_system key: the module packages aurora, so every shipped
# material is a member of it.
aurora:
  label: 'Aurora'
  tokens:
    space:
      gutter: '2rem'
    color:
      accent: '#6941c6'
  animations:
    aurora_fade:
      description: 'A soft entrance for aurora sections.'
      steps:
        from:
          opacity: '0'
        to:
          opacity: '1'
