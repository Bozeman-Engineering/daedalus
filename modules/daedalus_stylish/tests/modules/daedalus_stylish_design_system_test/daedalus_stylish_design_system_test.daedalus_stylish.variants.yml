# The variant wearing the package's other three materials. A member of
# aurora (the module default), it validates in aurora's universe: its own
# skin's token and its own swatch and animation resolve whether or not
# aurora is the active design system, so the package lands whole on a
# strict site while another system is active.
aurora_band:
  label: 'Aurora band'
  description: 'The aurora opener.'
  scope: 'kind:container'
  styles:
    '':
      default:
        padding: 'var(--space-gutter)'
        background-color: 'var(--swatch-aurora_accent)'
        animation-name: 'motion-aurora_fade'

# The variant on the package's own axis. A member like aurora_band, its
# token resolves in aurora's universe whatever is active, but the rhythm
# axis exists only under aurora's law, which the site layers only while
# aurora is active: the sync refuses it (STYLE_VARIANT_AXIS_INVALID)
# while another system is active and lands it when aurora is activated.
aurora_rhythm:
  label: 'Aurora rhythm'
  description: 'The aurora band spacing.'
  scope: 'kind:container'
  axis: rhythm
  styles:
    '':
      default:
        padding: 'var(--space-gutter)'
