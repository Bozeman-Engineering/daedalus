block:
  # Scalars replace across module layers.
  presentation: unit
entity:
  fields:
    field_internal:
      # Booleans replace too: the later module re-declares existence.
      element: true
site:
  branding:
    # Scalars replace across module layers in the site lane too.
    slogan: 'Extra slogan'
  # Maps merge: the extra module adds a group beside the base module's.
  groups:
    bands:
      label: Bands
instances:
  '.in-*':
    # Maps merge across module layers in the instances lane too: the tag
    # relabel replaces, the new tag joins.
    tags:
      p: 'Extra paragraph'
      h2: 'Heading 2'
