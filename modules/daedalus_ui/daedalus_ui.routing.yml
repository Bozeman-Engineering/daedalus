# The editor chrome colors. The route sits under the Daedalus config
# category's UI sub-category (daedalus.admin_config_ui, the door the root
# module opens). Two names here are a contract: the route name and the form
# id (daedalus_ui_settings). Modules from outside the package alter the form
# by that id to add a details element of their own, so neither name changes
# without a word to them.
daedalus_ui.settings:
  path: '/admin/config/daedalus/ui/chrome'
  defaults:
    _title: 'Editor chrome'
    _form: 'Drupal\daedalus_ui\Form\SettingsForm'
  requirements:
    _permission: 'administer Daedalus UI configuration'

# The bundle roster: the page builder's state on every bundle, read-only,
# the second door to the bundle form's Page builder tab (the one write
# path). Under the same UI sub-category and gate as the chrome form.
daedalus_ui.bundle_roster:
  path: '/admin/config/daedalus/ui/content-types'
  methods: [GET]
  defaults:
    _title: 'Page builder on content types'
    _controller: '\Drupal\daedalus_ui\Controller\BundleRoster::build'
  requirements:
    _permission: 'administer Daedalus UI configuration'

daedalus_ui.load_editable_page:
  path: '/daedalus-ui/load-editable-page/{entity_type}/{entity}/{view_mode}'
  methods: [GET]
  defaults:
    _title: 'Load Editable Page'
    _controller: '\Drupal\daedalus_ui\Controller\LoadEditablePage'
  options:
    parameters:
      entity:
        type: entity:{entity_type}
  requirements:
    _permission: 'use daedalus ui edit mode'

daedalus_ui.settings.save_user_hotkey:
  path: '/daedalus-ui/save-user-hotkey/{binding_id}/{hotkey}'
  defaults:
    _title: 'Save User Hotkey'
    _controller: '\Drupal\daedalus_ui\Controller\Settings::saveHotkey'
  methods: [POST]
  requirements:
    _permission: 'use daedalus ui edit mode'
    _csrf_request_header_token: 'TRUE'
    binding_id: '[a-z0-9_.]+'
    hotkey: '[a-z0-9+]+'

daedalus_ui.settings.remove_media_file_association:
  path: '/daedalus-ui/remove-media-file-association/{file_extension}'
  defaults:
    _title: 'Remove media file association'
    _controller: '\Drupal\daedalus_ui\Controller\Settings::removeMediaFileAssociation'
  methods: [POST]
  requirements:
    _permission: 'use daedalus ui edit mode'
    _csrf_request_header_token: 'TRUE'

# The value is the request's JSON body, a scalar or a structure alike:
# one route, one controller, one EditorSettings write path.
daedalus_ui.settings.save_setting:
  path: '/daedalus-ui/setting/{namespace}/{key}'
  defaults:
    _title: 'Save editor setting'
    _controller: '\Drupal\daedalus_ui\Controller\Settings::saveSetting'
  methods: [POST]
  requirements:
    _permission: 'use daedalus ui edit mode'
    _csrf_request_header_token: 'TRUE'
    namespace: '[a-z0-9_]+'
    key: '[a-z0-9_]+'

# The upload lane's two doors (MediaUpload). Each saves a file and creates
# media, so each is a POST carrying the session token, open to an actor who
# is in Edit Mode's audience and may update the host; the controller asks
# for create access on the media bundle.
daedalus_ui.replace_media:
  path: '/daedalus-ui/replace-media/{entity_type}/{entity}/{view_mode}/{media_reference}/{media_bundle}'
  defaults:
    _title: 'Media upload'
    _controller: '\Drupal\daedalus_ui\Controller\MediaUpload::replaceMedia'
  methods: [POST]
  requirements:
    _permission: 'use daedalus ui edit mode'
    _entity_access: entity.update
    _csrf_request_header_token: 'TRUE'
  options:
    parameters:
      entity:
        type: entity:{entity_type}

daedalus_ui.new_media:
  path: '/daedalus-ui/new-media/{entity_type}/{entity}/{view_mode}'
  defaults:
    _title: 'Media upload'
    _controller: '\Drupal\daedalus_ui\Controller\MediaUpload::newMedia'
  methods: [POST]
  requirements:
    _permission: 'use daedalus ui edit mode'
    _entity_access: entity.update
    _csrf_request_header_token: 'TRUE'
  options:
    parameters:
      entity:
        type: entity:{entity_type}

# The responsive preview pop-out: a device-sized iframe shell. The window
# renders no entity data of its own (the iframe loads the edited page's own
# URL, where entity access applies as always), so the edit-mode permission
# is the only gate it needs.
daedalus_ui.responsive_preview:
  path: '/daedalus-ui/responsive-preview'
  methods: [GET]
  defaults:
    _title: 'Responsive preview'
    _controller: '\Drupal\daedalus_ui\Controller\ResponsivePreview::build'
  requirements:
    _permission: 'use daedalus ui edit mode'
  options:
    _daedalus_ui.popout: true
