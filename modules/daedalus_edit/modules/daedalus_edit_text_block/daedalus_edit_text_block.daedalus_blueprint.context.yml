block_types:
  text:
    guidance: 'A single run of plain text rendered as ONE semantic element. field_text_tag picks the tag: h1..h6 for headings (h1 only for the page''s one headline; the theme prints the title as h1 otherwise), p for a standalone line of prose, span for a bare fragment; leaving it empty renders a p. Use it for every heading and every short single-line piece of copy (eyebrows, captions, link labels). The tag is semantics only; size and weight come from the style guide''s materials, so never pick a tag for its size: dress the text with styles. Setting field_text_url turns the text into a link (an anchor nested inside the tag), the shape for buttons and call-to-action links; button looks live on the link as materials. For multi-paragraph or formatted copy use the formatted_text block instead.'
