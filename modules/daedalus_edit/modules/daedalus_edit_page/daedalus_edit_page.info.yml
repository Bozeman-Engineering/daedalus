name: 'Daedalus Edit Page'
type: module
description: 'The Daedalus Page content type for the page builder.'
core_version_requirement: '>=11.3 <11.5'
package: Daedalus
dependencies:
  - drupal:node
  - drupal:menu_ui
  - drupal:layout_builder
  - daedalus:daedalus_ui
  - daedalus:daedalus_layout
  - daedalus:daedalus_edit
  # The shipped display (core.entity_view_display.node.page.default) holds
  # one blank layout_builder_blank section; the layouts a page places are
  # daedalus_stylish layouts (the page builder
  # offers only those, and the AI layout guidance names them).
  - daedalus:daedalus_stylish_layouts
