daedalus_edit.entity_form:
  path: '/daedalus-edit/entity-form/{entity_type}/{entity}'
  defaults:
    _title: 'Entity Form'
    _controller: '\Drupal\daedalus_edit\Controller\MultipleEntityFormController::entityForm'
  options:
    parameters:
      entity:
        type: entity:{entity_type}
  requirements:
    _permission: 'access inline editing'

daedalus_edit.tempstore.save:
  path: '/daedalus-edit/tempstore/save/{entities}'
  defaults:
    _title: 'Tempstore Save'
    _controller: '\Drupal\daedalus_edit\Controller\Tempstore::save'
  requirements:
    _permission: 'access inline editing'

daedalus_edit.delete_confirmation_form:
  path: '/daedalus-edit/tempstore/delete-confirm/{entities}'
  defaults:
    _form: '\Drupal\daedalus_edit\Form\ConfirmDiscardChangesForm'
    _title: 'Discard changes?'
  requirements:
    _permission: 'access inline editing'
