name: 'Daedalus AI'
type: module
description: 'Adds an AI assistant chat panel to the page builder.'
package: Daedalus
core_version_requirement: '>=11.3 <11.5'
php: 8.1
lifecycle: experimental
configure: daedalus_ui.settings
dependencies:
  - daedalus:daedalus
  # The attachment store holds a conversation's files on file.usage.
  - drupal:file
  - daedalus:daedalus_ui
  # The chat sidebar speaks ai 1.5's chat-turn request contract (a
  # chat_processor_plugin and its plugin_configuration in the body);
  # ai_chatbot's /api/deepchat refuses the pre-1.5 body since 1.5.0.
  - ai:ai_chatbot (>=1.5)
  - ai_agents:ai_agents
  - daedalus:daedalus_blueprint
  - daedalus:daedalus_blueprint_ai
  # AI edits answer the same mutation-response contract as the editing
  # endpoint (MutationResponseBuilder, TargetKeyMapper spine keys).
  - daedalus:daedalus_blueprint_api
