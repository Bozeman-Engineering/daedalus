daedalus_ai_memory.settings:
  type: config_object
  label: 'Daedalus AI Memory settings'
  mapping:
    enabled_agents:
      type: sequence
      label: 'Agent IDs with persistent memory'
      sequence:
        type: string
        label: 'Agent ID'
    cache_ttl:
      type: string
      label: 'Prompt cache TTL asked of a capable provider'
    segment_budget_tokens:
      type: integer
      label: 'Segment budget (tokens)'
    segment_budget_minimum_tokens:
      type: integer
      label: 'Segment budget minimum (tokens)'
    segment_budget_overrides:
      type: sequence
      label: 'Segment budget overrides per model'
      sequence:
        type: mapping
        label: 'Override'
        mapping:
          model:
            type: string
            label: 'Model ID'
          tokens:
            type: integer
            label: 'Budget (tokens)'
    segment_headroom_tokens:
      type: integer
      label: 'Headroom below the model maximum input (tokens)'
    reframe_minimum_tokens:
      type: integer
      label: 'Reframe minimum (tokens)'
