services:
  # The context spine's runner: decorates the assistant's agent runner for
  # the enabled agents, persists the transcript and the wrapper's
  # non-history state per conversation, renders before and absorbs after
  # each leg, and runs the usage gate before any model call.
  daedalus_ai_memory.AgentMemoryRunner:
    class: Drupal\daedalus_ai_memory\Service\AgentMemoryRunner
    decorates: ai_assistant_api.agent_runner
    arguments:
      - '@.inner'
      - '@ai.provider'
      - '@tempstore.private'
      - '@event_dispatcher'
      - '@config.factory'
      - '@entity_type.manager'
      - '@ai.hostname_filter_service'
      - '@daedalus_ai_memory.transcript_renderer'
      - '@daedalus_ai_memory.segment_policy'
      - '@daedalus_ai_memory.carry_over_generator'
      - '@daedalus_ai_ledger.usage_ledger'
      - '@daedalus_ai_ledger.usage_gate'
      - '@current_user'
      - '@daedalus_ai.model_choice'
      - '@?plugin.manager.ai_agents'

  # The context spine's renderer: the transcript's current segment to the
  # wrapper's chat history and the rendering plan, per provider capability.
  daedalus_ai_memory.transcript_renderer:
    class: Drupal\daedalus_ai_memory\Transcript\TranscriptRenderer
  Drupal\daedalus_ai_memory\Transcript\TranscriptRenderer: '@daedalus_ai_memory.transcript_renderer'

  # The context spine's segment policy: the budget a segment runs under
  # (config, the provider's ceiling, the model's maximum input) and the
  # close decision (budget at a finished turn, a reframing skill past the
  # minimum). Pure over its inputs; the runner reads the ledger row.
  daedalus_ai_memory.segment_policy:
    class: Drupal\daedalus_ai_memory\Segment\SegmentPolicy
    arguments:
      - '@config.factory'
      - '@daedalus_blueprint.skills_resolver'
  Drupal\daedalus_ai_memory\Segment\SegmentPolicy: '@daedalus_ai_memory.segment_policy'

  # The carry-over a closing segment hands the next one, generated by one
  # chat call over the closing segment's exact prefix.
  daedalus_ai_memory.carry_over_generator:
    class: Drupal\daedalus_ai_memory\Segment\CarryOverGenerator
  Drupal\daedalus_ai_memory\Segment\CarryOverGenerator: '@daedalus_ai_memory.carry_over_generator'

  # Keeps ai_assistant_api's rendering of the frontend's session context
  # out of a managed agent's system prompt: the spine delivers that
  # context as per-turn blocks, and the lines vary between the legs of
  # one turn, which rewrites the cached prefix.
  daedalus_ai_memory.frontend_context_subscriber:
    class: Drupal\daedalus_ai_memory\EventSubscriber\FrontendContextSubscriber
    arguments:
      - '@config.factory'
    tags:
      - { name: event_subscriber }
