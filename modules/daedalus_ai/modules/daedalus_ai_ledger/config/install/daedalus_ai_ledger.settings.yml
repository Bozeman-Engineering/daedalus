# The price table: USD per million tokens by model id, four token buckets
# and a per-call figure. input is the uncached remainder, cache_read what
# the prompt cache served, cache_write what was written to it (every TTL
# at this one price; the 1 hour write is billed higher by Anthropic, and
# the row keeps the split for a later finer table), output the completion
# including reasoning where the provider counts it there. A bucket at zero
# stops counting it. per_call is USD added once per leg on top of the
# tokens (a leg always makes exactly one call), so a leg whose provider
# reports no tokens still weighs it; zero means the call itself is free.
# A model missing here is priced by the `*` row at the end of the table,
# so every leg counts against the caps; the status report names the
# models that rode it so their own rows can be added.
# The Anthropic rows were seeded 2026-10-19 from Anthropic's price list;
# the Gemini row is commented where it stands.
prices:
  - model: claude-opus-5-5
    input: 4.0
    output: 20.0
    cache_read: 0.2
    cache_write: 5.0
    per_call: 0.0
  - model: claude-sonnet-5-5
    input: 2.0
    output: 10.0
    cache_read: 0.2
    cache_write: 2.5
    per_call: 0.0
  - model: claude-haiku-5-5
    input: 0.1
    output: 0.5
    cache_read: 0.01
    cache_write: 0.125
    per_call: 0.0
  - model: claude-fable-5-1
    input: 10.0
    output: 50.0
    cache_read: 0.25
    cache_write: 12.5
    per_call: 0.0
  # The Gemini image model, by the id the provider's event reports (the
  # `models/` prefix included). Prices from Google's Gemini API pricing page
  # (https://ai.google.dev/gemini-api/docs/pricing), Standard tier, read
  # 2026-10-19: $2.00 per million input tokens, $120.00 per million image
  # output tokens. The one output bucket carries the image rate, so the few
  # text and thinking tokens an image call also emits ($12.00 on the page)
  # are overcounted rather than left out; caching is not listed for the
  # model, so a cached read counts at the input rate.
  - model: models/gemini-3-pro-image
    input: 2.0
    output: 120.0
    cache_read: 2.0
    cache_write: 0.0
    per_call: 0.0
  # The fallback row: it prices any model with no row of its own, which is
  # what makes every leg count against the caps whatever model it ran on.
  # Edit it, never delete it. Seeded as a copy of the dearest row above
  # (Fable 5.1) so an unknown model is overcounted rather than
  # undercounted, with a per-call figure near that of a 4K image, so a
  # provider that reports no tokens at all still weighs its calls.
  - model: '*'
    input: 10.0
    output: 50.0
    cache_read: 0.25
    cache_write: 12.5
    per_call: 0.25
# Spend windows, each {scope, period, usd, anchor}; empty is unlimited.
# scope is `site` (every priced leg on the site) or `user` (the account's
# own); period is an ISO 8601 duration (PT5H, P7D, P1M); usd is the cap;
# anchor is a date (Y-m-d, the site's timezone) or empty. Anchored, the
# window runs from the latest boundary at or before now to the next, the
# boundaries stepping from the anchor by the period (a P1M window anchored
# on a billing day lands on that day each month) and clears whole at the
# boundary; empty, it rolls over the last period and usage ages out
# continuously. Site windows are checked first and admit no bypass; the
# `bypass ai usage caps` permission skips user windows only. Site windows
# are for a site whose AI runs on a provider account shared with other
# sites, under a budget set by whoever operates that account: the
# provider's own limits are not per site, and the site's administrators
# are who the budget binds, so their bypass cannot lift it.
caps: []
# How many days of rows to keep: rows older than this are deleted on cron,
# in batches through the entity storage. 0 keeps every row forever. The
# purge never cuts under the longest configured window (a rolling P1M
# spans up to 31 days, an anchored window up to two periods), so a
# shorter retention is raised to it and a window sum is never computed
# over a hole. A row is under 1 KB, but the windows read only the last
# month of them; a year keeps the status report's history and a season
# of reporting without carrying every leg ever run.
retention_days: 365
