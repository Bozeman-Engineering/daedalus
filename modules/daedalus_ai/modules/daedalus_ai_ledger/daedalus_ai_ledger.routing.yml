daedalus_ai_ledger.settings:
  path: '/admin/config/ai/usage-ledger'
  defaults:
    _form: '\Drupal\daedalus_ai_ledger\Form\SettingsForm'
    _title: 'Daedalus AI Ledger'
  requirements:
    _permission: 'administer ai usage ledger'

# The chat's meter: the current user's usage windows as the gate sees
# them, {windows: [{scope, period, label, remaining, reached, reset_at}]},
# no USD anywhere. The windows that apply to the user, as the gate
# refuses by them: every site window, and the user windows unless the
# user holds the bypass permission; empty when none applies. Per user and
# per moment, so never cached.
daedalus_ai_ledger.usage:
  path: '/daedalus-ai/usage'
  defaults:
    _controller: '\Drupal\daedalus_ai_ledger\Controller\UsageStatusController::status'
  methods: [GET]
  requirements:
    _permission: 'use ai assistant'
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: TRUE
