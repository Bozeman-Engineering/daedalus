daedalus_ai.settings:
  type: config_object
  label: 'Daedalus AI settings'
  mapping:
    assistant_id:
      type: string
      label: 'AI Assistant ID'
    placeholder_image:
      type: string
      label: 'Placeholder image'
    image_generation_enabled:
      type: boolean
      label: 'Enable AI image generation'
    webdriver_url:
      type: string
      label: 'WebDriver endpoint for the AI render tool'
