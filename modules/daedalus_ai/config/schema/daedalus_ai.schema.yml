daedalus_ai.settings:
  type: config_object
  label: 'Daedalus AI settings'
  mapping:
    assistant_id:
      type: string
      label: 'AI Assistant ID'
    placeholder_image:
      type: string
      label: 'Placeholder image'
    image_generation_enabled:
      type: boolean
      label: 'Enable AI image generation'
    model_choices:
      type: sequence
      label: 'Models users may choose'
      sequence:
        type: mapping
        label: 'Model choice'
        mapping:
          provider:
            type: string
            label: 'Provider plugin id'
          model:
            type: string
            label: 'Model id'
          label:
            type: label
            label: 'Label shown in the chat menu'
