services:
  # Deliberately registered in reverse priority order to prove the registry
  # sorts by tag priority, not declaration order.
  daedalus_layout_transform_test.modern_annotator:
    class: Drupal\daedalus_layout_transform_test\ModernAnnotator
    tags:
      - { name: daedalus_layout.component_transform, priority: 0 }

  daedalus_layout_transform_test.legacy_block_transform:
    class: Drupal\daedalus_layout_transform_test\LegacyBlockTransform
    tags:
      - { name: daedalus_layout.component_transform, priority: 10 }

  daedalus_layout_transform_test.legacy_section_transform:
    class: Drupal\daedalus_layout_transform_test\LegacySectionTransform
    tags:
      - { name: daedalus_layout.section_transform }

  daedalus_layout_transform_test.legacy_name_host_transform:
    class: Drupal\daedalus_layout_transform_test\LegacyNameHostTransform
    tags:
      - { name: daedalus_layout.host_transform }
