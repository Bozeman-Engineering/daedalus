daedalus_layout.block_update:
  title: 'Configure'
  route_name: 'layout_builder.update_block'
  group: 'layout_builder_block'
  options:
    supports_nested_layouts: 'true'
    attributes:
      class: ['use-ajax']
  weight: 100

daedalus_layout.block_remove:
  title: 'Remove block'
  route_name: 'layout_builder.remove_block'
  group: 'layout_builder_block'
  options:
    supports_nested_layouts: 'true'
    attributes:
      class: ['use-ajax']
      data-dialog-type: modal
  weight: 130
