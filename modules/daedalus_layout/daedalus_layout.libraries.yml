editing_ui:
  js:
    js/behaviors/dialog-close-override.js: { attributes: { type: 'module' }}
  css:
    theme:
      css/blank-page.css: {}
  dependencies:
    - core/drupal.message
    - core/drupal.displace
    - daedalus_ui/modes
    - daedalus_ui/edit_mode

# Selection verbs (Duplicate / Remove / Configure). Attached as a dependency
# of daedalus_ui/edit_mode via daedalus_layout_library_info_alter() so the verbs
# ride the app wherever Edit Mode loads, without any tool coupling.
verbs:
  js:
    js/verbs/daedalus-layout-verbs.js: { attributes: { type: 'module' }}

# The Add panel: one list of folding sets (Favorites, each group, All)
# over everything the canvas can place, with its search, its star, its
# row menu, its drag sources and the Insert verb's click-to-place. A
# bundled Preact surface (js/src/, built by webpack.config.js into
# js/dist/add-panel.bundle.js; `npm run build:prod` from the daedalus
# root). A plain sidebar panel, not a tool, attached by the PlaceBlock
# Sidebar plugin's build(), so it loads wherever the panel renders
# (present-but-hidden included).
add_panel:
  js:
    js/dist/add-panel.bundle.js: { minified: true, attributes: { type: 'module' } }
  css:
    theme:
      css/add-panel.css: {}
  dependencies:
    - core/drupal
    - core/drupalSettings
    - daedalus_layout/editing_ui
    # The rows wear the shared panel item recipe, the headings the
    # outline row grammar (the page elements tree's and code mode's), the
    # search box the recessed input, the collapse pair the icon button.
    - daedalus_ui/panel_controls
    # The row menu is the shared menu primitive.
    - daedalus_ui/menu
    # The collapse pair (daedalus_ui's outline controls, seated in the
    # header's slot) registers with the reveal engine for its lifetime.
    - daedalus_ui/reveal
    # The star and the collapse pair name themselves through the shared
    # tooltip.
    - daedalus_ui/tooltip

# Canvas display preferences (container outlines) plus edit-mode
# interaction suppression. Contributed to the Edit Mode settings panel by
# the LayoutSettings subscriber, which attaches this library with its
# toggles.
layout_settings:
  js:
    js/settings/disable-interactive-elements.js: {}
    js/settings/container-outlines.js: {}
  css:
    theme:
      js/settings/container-outlines.css: {}
  dependencies:
    - daedalus_layout/editing_ui

# The start chooser on a content entity add form (StartChooser): the cards,
# the group filters and the "Starting from" line. Styles only; a card is a
# link and a filter is a link, so nothing here needs a script.
start_chooser:
  css:
    theme:
      css/start-chooser.css: {}

# The icon picker form element (daedalus_layout_icon_picker): preview refresh on a
# media library pick, the Remove button. Attached by the element itself.
icon_picker:
  js:
    js/icon-picker/icon-picker.js: {}
  css:
    theme:
      js/icon-picker/icon-picker.css: {}
  dependencies:
    - core/jquery
    - core/drupal
    - core/once
