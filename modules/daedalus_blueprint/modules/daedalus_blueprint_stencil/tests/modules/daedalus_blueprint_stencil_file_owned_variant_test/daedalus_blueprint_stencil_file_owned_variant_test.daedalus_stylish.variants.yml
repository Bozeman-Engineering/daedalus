# The cross-site package shape: daedalus_blueprint_stencil_test ships the
# 'hero' FILE stencil, and this variant ships owned by it. File stencils
# have no entity, so sync resolves the owner through stencil discovery and
# stores it in the stencil_file machine-name lane.
hero_look:
  label: 'Hero look'
  scope: 'kind:container'
  stencil: 'hero'
  styles:
    '':
      default:
        background-color: 'aliceblue'
