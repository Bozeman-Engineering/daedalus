services:
  _defaults:
    autowire: true
    autoconfigure: true

  daedalus_blueprint_stencil.discovery:
    class: Drupal\daedalus_blueprint_stencil\StencilDiscovery
    arguments:
      $cache: '@cache.default'

  Drupal\daedalus_blueprint_stencil\StencilDiscoveryInterface: '@daedalus_blueprint_stencil.discovery'
  Drupal\daedalus_blueprint_stencil\StencilDiscovery: '@daedalus_blueprint_stencil.discovery'

  daedalus_blueprint_stencil.exporter:
    class: Drupal\daedalus_blueprint_stencil\StencilExporter
    arguments:
      - '@daedalus_blueprint.element_locator'
      - '@daedalus_blueprint.daedalus_layout_adapter'
      - '@daedalus_blueprint.layout_serializer'
      - '@daedalus_blueprint.managed_keys_registry'
      - '@entity_type.manager'
      - '@?plugin.manager.core.layout'

  Drupal\daedalus_blueprint_stencil\StencilExporterInterface: '@daedalus_blueprint_stencil.exporter'
  Drupal\daedalus_blueprint_stencil\StencilExporter: '@daedalus_blueprint_stencil.exporter'

  daedalus_blueprint_stencil.manager:
    class: Drupal\daedalus_blueprint_stencil\StencilManager
    arguments:
      - '@entity_type.manager'
      - '@daedalus_blueprint_stencil.exporter'
      - '@daedalus_blueprint_stencil.discovery'
      - '@current_user'
      - '@datetime.time'
      # A saved stencil joins the active design system unless the gesture
      # opts out; adopted variants take the stencil's membership.
      - '@daedalus_blueprint.active_design_system'
      # The distro lock decides what a file stencil's read-only refusal
      # points at: fork (lock holds) or drush stencil-ship (developer gate).
      - '@daedalus_blueprint.distro_lock'

  Drupal\daedalus_blueprint_stencil\StencilManager: '@daedalus_blueprint_stencil.manager'

  # The ship lane: a placement to a module as a stencil file (a graduating
  # content stencil's icon media copied beside it through the icon
  # resolver's media-to-file step) plus its owned variants (through
  # daedalus_stylish's variant shipper, optional: daedalus_stylish never learns about
  # stencils and this module never requires daedalus_stylish).
  daedalus_blueprint_stencil.shipper:
    class: Drupal\daedalus_blueprint_stencil\StencilShipper
    arguments:
      - '@daedalus_blueprint.element_locator'
      - '@daedalus_blueprint.daedalus_layout_adapter'
      - '@daedalus_blueprint_stencil.exporter'
      - '@daedalus_blueprint_stencil.manager'
      - '@daedalus_blueprint_stencil.discovery'
      - '@module_handler'
      - '@extension.list.module'
      - '@entity_type.manager'
      - '@daedalus_blueprint.icon_resolver'
      - '@file_system'
      # The written file names its membership explicitly (the graduating
      # stencil's, else the existing file's, else the module's own system).
      - '@daedalus_blueprint.active_design_system'
      - '@?daedalus_stylish.variant_shipper'

  Drupal\daedalus_blueprint_stencil\StencilShipper: '@daedalus_blueprint_stencil.shipper'

  daedalus_blueprint_stencil.operation_handler:
    class: Drupal\daedalus_blueprint_stencil\StencilOperationHandler
    arguments:
      - '@daedalus_blueprint_stencil.discovery'
      - '@uuid'
      # A service closure because the dependency is circular by construction:
      # daedalus_blueprint.operations owns the handler registry that collects
      # this handler.
      - !service_closure '@daedalus_blueprint.operations'
      - '@?plugin.manager.core.layout'
    tags:
      - { name: daedalus_blueprint.operation_handler }

  # The stencil materials provider: discovery's served set as roster
  # records (the ONE place stencils are read into the materials spine), and
  # the stencil kind of the material gesture family (save_material /
  # update_material / remove_material dispatch here; the UI verbs submit
  # the same ops, StencilApiController's routes adapt onto the same
  # methods).
  daedalus_blueprint_stencil.materials_provider:
    class: Drupal\daedalus_blueprint_stencil\Materials\StencilMaterialsProvider
    arguments:
      - '@daedalus_blueprint_stencil.discovery'
      - '@daedalus_blueprint.icon_resolver'
      # A closure: the manager's exporter reaches the field handlers, whose
      # validator reads the roster this provider feeds (circular otherwise).
      - !service_closure '@daedalus_blueprint_stencil.manager'
      - '@current_user'
    tags:
      - { name: daedalus_blueprint.materials_provider }
  Drupal\daedalus_blueprint_stencil\Materials\StencilMaterialsProvider: '@daedalus_blueprint_stencil.materials_provider'

  # daedalus_blueprint_stencil.variant_ownership_checker (the ownership half
  # of daedalus_stylish's variant applicability seam) is NOT defined here: its class
  # cannot load without daedalus_stylish, and container compilation reflects every
  # yml-registered class even when nothing instantiates it. It registers in
  # DaedalusBlueprintStencilServiceProvider, only when daedalus_stylish is installed.
