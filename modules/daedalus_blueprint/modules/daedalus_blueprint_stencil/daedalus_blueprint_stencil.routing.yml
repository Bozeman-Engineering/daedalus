# Details and delete are ADAPTERS over the stencil kind of the material
# gesture family (StencilMaterialsProvider::update() / remove(), the same
# methods update_material / remove_material dispatch to): the Add panel's
# stencil menu manages the vocabulary from wherever it is open, with no
# page batch to ride, so it speaks to the provider through these routes and
# receives the same materials delta the op lane answers with.
daedalus_blueprint_stencil.update_details:
  path: '/daedalus-blueprint/stencil/{reference}/details'
  methods: [POST]
  defaults:
    _controller: 'Drupal\daedalus_blueprint_stencil\Controller\StencilApiController::updateDetails'
    _title: 'Update stencil details'
  options:
    no_cache: 'TRUE'
  requirements:
    _permission: 'save stencils'
    _csrf_request_header_token: 'TRUE'

daedalus_blueprint_stencil.delete:
  path: '/daedalus-blueprint/stencil/{reference}/delete'
  methods: [POST]
  defaults:
    _controller: 'Drupal\daedalus_blueprint_stencil\Controller\StencilApiController::delete'
    _title: 'Delete stencil'
  options:
    no_cache: 'TRUE'
  requirements:
    _permission: 'save stencils'
    _csrf_request_header_token: 'TRUE'

# The variant-ownership lifecycle gestures. Adopt rides the op lane
# (save_material / update_material adopt_variants, additive, AI parity is a
# feature); release and transfer are non-additive mutations of
# non-revisionable identity fields on site-wide content, not one of the
# family's three verbs, so they stay manager gestures on routes:
# deliberately out of the AI's structural reach.
daedalus_blueprint_stencil.release_variant:
  path: '/daedalus-blueprint/stencil-variant/{reference}/release'
  methods: [POST]
  defaults:
    _controller: 'Drupal\daedalus_blueprint_stencil\Controller\StencilApiController::releaseVariant'
    _title: 'Release an owned variant'
  options:
    no_cache: 'TRUE'
  requirements:
    _permission: 'save stencils'
    _csrf_request_header_token: 'TRUE'

daedalus_blueprint_stencil.transfer_variant:
  path: '/daedalus-blueprint/stencil-variant/{reference}/transfer'
  methods: [POST]
  defaults:
    _controller: 'Drupal\daedalus_blueprint_stencil\Controller\StencilApiController::transferVariant'
    _title: 'Transfer an owned variant'
  options:
    no_cache: 'TRUE'
  requirements:
    _permission: 'save stencils'
    _csrf_request_header_token: 'TRUE'
