# allow-list is what the AI may create). Same route, two links; SETTINGS.md
# at the daedalus repo root rosters both.
daedalus_blueprint_config.settings:
  title: 'Daedalus Blueprint Config'
  route_name: daedalus_blueprint_config.settings
  description: 'Allow-list config entity types that blueprint operations (and AI agents) may create.'
  parent: system.admin_config_development

# The second door: the Daedalus AI sub-category. The first door is
