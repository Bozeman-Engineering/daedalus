# system.admin_config_development; see SETTINGS.md.
daedalus_blueprint_config.settings.daedalus:
  title: 'Blueprint config'
  route_name: daedalus_blueprint_config.settings
  description: 'Allow-list config entity types that blueprint operations (and AI agents) may create.'
