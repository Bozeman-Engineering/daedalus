name: Daedalus Blueprint AI
type: module
description: Exposes daedalus_blueprint operations as AI agent tools for the Drupal AI module.
package: Daedalus
core_version_requirement: '>=11.3 <11.5'
lifecycle: experimental
dependencies:
  - daedalus:daedalus_blueprint
  - ai:ai
  # The page language and the skills obligation ride the agent's system
  # prompt; the conversation id reaches the tool layer at pass-context time.
  - ai_agents:ai_agents
  - ai:ai_assistant_api
